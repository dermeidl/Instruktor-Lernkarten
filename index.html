  - Erhöht Blutdruck stark → nicht für Anfänger oder Menschen mit Herz-Kreislauf-Problemen`},{id:`Anatomie 🩻-7`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`7) Nennen Sie die Vor und Nachteile der Pressatmung! Für welche Personengruppe würden Sie diese empfehlen?`,answer:`- Vorteile
  - Stabilisierung des Körpers (Rumpfstabilität): Hoher Druck im Rumpfbereich → inneres Korsett
  - Leistungssteigerung → höhere Gewichte stemmen
  - Schutz für Wirbelsäule
  - Ist für Gewichtheber und Strongmen geeignet
- Nachteile
  - Blutdruck wird erhöht
  - Gefahr von Schwindelanfällen und Ohnmacht
  - Wegen dem hohen Druck ist dies nicht für Personen mit hohem Blutdruck, Herzproblemen, Gefäßerkrankungen oder Schwangere geeignet
- Empfehlung
  - Gesunden Menschen ohne Vorbelastungen mit guter Technik
  - Leistungssportler im Kraftsport (Powerlifter, Strongmen, Gewichtheber)
  - Nicht empfohlen bei Personen mit Bluthochdruck oder Herz-Kreislaufproblemen`},{id:`Anatomie 🩻-8`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`8) Wodurch wird die „Beckenbalance“ definiert?`,answer:`Die Beckenbalance ist dann gegeben, wenn das Becken in einer neutralen Position steht – also weder nach vorne (anterior) noch nach hinten (posterior) gekippt bzw. schief steht oder rotiert ist
- Entscheidend für gesunde Körperhaltung, Funktion der Wirbelsäule und eine effektive Kraftübertragung
- Muskuläres Gleichgewicht
  - Hüftbeuger (z.B. iliopsoas) kippen das Becken nach vorn → anterior
  - Hüftstrecker (Glutealmuskulatur, Hamstrings) ziehen das Becken nach hinten und stabilisieren
  - Bauchmuskeln kippen das Becken nach hinten → posterior
  - Rückenstrecker (erector spinae) ziehen das Becken nach vorn → Hyperlordose
- Fehlstellungen
  - Anterior Beckenkippung → Hohlkreuz → Bauch wölbt sich
  - Posterior Beckenkippung → Flacher Rücken → Gesäß eingezogen
  - Beckenschiefstand → unterschiedliche Beinlängen + ISG-Probleme
  - Beckenrotation → häufig bei Skoliose oder muskulären Asymmetrien
- Orientierung
  - Sagittalebene (vorne/hinten kippen) → Vorderer oberer Darmbeinstachel (SIAS) und Schambein (Symphyse) stehen in einer senkrechten Linie.
  - Frontalebene (seitliches Kippen) → Linker und rechter Darmbeinkamm (Crista iliaca) stehen auf gleicher Höhe.
  - Transversalebene (Verdrehung) → Schambein und Steißbein bilden eine waagrechte Linie.
[Abbildung im Wiki]`},{id:`Anatomie 🩻-9`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`9) Wodurch wird die „Brustkorbbalance“ definiert?`,answer:`Die Brustkorbbalance ist gegeben, wenn:
  - Der Brustkorb (Thorax) in seiner natürlichen Position über dem Becken ausgerichtet ist
  - Der Brustkorb weder nach vorn „aufgeklappt“ (Rippen ragen raus) noch eingesunken ist
  - Die unteren Rippen sind nach innen gezogen, nicht sichtbar vorstehend
  - Keine Überstreckung oder Rundung der Brustwirbelsäule oder des unteren Rückens (Hyperlordose/Hyperkyphose)
- Optimiert Atmung: Ein gut ausgerichteter Brustkorb ermöglicht dem Zwerchfell freie Bewegung → effiziente Atmung
- Orientierung
  - Die Schulterblattspitze (Acromiom) und die Brustbeinspitze liegen in einer waagrechten Linie
  - Senkrechte Linie: Brustbein (Sternum) → Symphyse (Schambein) → Knöchel → Ohr
  - Waagrechte Ebene: Unterer Rippenbogen (rechts/links auf gleicher Höhe)
- Fehlhaltungen
  - Eingefallener Brustkorb / Rundrücken (Hyperkyphose)
  - Hohlkreuz (Hyperlordose)
  - Einseitig abgesenkte Schulter
  - Flache Atmung
  - Blockierte Rippen
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Anatomie 🩻-10`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`10) Wie ist die sogenannte Beinachse definiert und warum sollte sie immer eingehalten werden?`,answer:`Die Beinachse ist eine senkrechte gerade Linie zwischen: Hüftgelenk → Kniegelenk → Sprunggelenk
- Funktion
  1. Gelenkschutz
    - Vermeidet Valgusstellung (X-Bein) → Risiko für Innenband, Meniskus, vorderes Kreuzband
    - Vermeidet Varusstellung (O-Bein) → Risiko für Außenband, lateraler Meniskus
  1. Kraftübertragung
    - Effiziente Lastübertragung von Hüfte → Knie → Sprunggelenk
    - Verhindert „Energieverluste“ durch seitliche Bewegungen
  1. Verletzungsprophylaxe
    - Besonders wichtig bei Kniebeugen, Sprüngen, Landungen, Richtungswechseln
    - Knie soll nie nach innen „einknicken“
  1. Langfristige Gesundheit
    - Vermeidet Arthrose und Überlastungsschäden (z. B. Patellaspitzensyndrom, Runner’s Knee, Achillessehnenprobleme)
[Abbildung im Wiki]`},{id:`Anatomie 🩻-11`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`11) Was verstehen Sie unter dem Begriff Valguswinkel?`,answer:`- Beim gesunden Menschen ist das Kniegelenk und Ellbogengelenk nicht vollkommen gerade, sondern steht in einem leichten X-Stellung (Valgusstellung) → Gelenk ist nach innen geknickt
- Der Valguswinkel ist der Winkel, der entsteht, wenn ein Körperteil (z. B. Unterarm, Unterschenkel) nach außen abweicht → Valgus = Achsenabweichung nach außen (vom Körper weg)
- Diese Achsabweichungen können zu Fehlbelastungen im Kniegelenk und langfristig zu Gelenkverschleiß (Arthrose) führen
- Der normale Valguswinkel beträgt etwa 5–20° (je nach Gelenk) → bei Frauen oft mehr als bei Männern
- Zu großer Valguswinkel: Führt zu einer Genu valgum (X-Bein-Stellung)
- Zu kleiner oder negativer Valguswinkel: Führt zu einer Genu varum (O-Bein-Stellung)
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Anatomie 🩻-12`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`12) Bizeps Curl mit der Langhantel - welche Problematik sehen Sie aufgrund des Valguswinkels?`,answer:`- Durch den natürlichen Valguswinkel im Ellbogengelenk stehen die Unterarme leicht nach außen ab → 5-20° (bei Frauen etwas mehr)
- Eine gerade Langhantel zwingt jedoch beide Handgelenke und Unterarme in eine symmetrische, parallele Position, was nicht der natürlichen Anatomie entspricht
- Ungünstige Belastung (Überlastung) für Bändern, Sehnen und Gelenkstrukturen
- Lösung: Kurzhantel oder SZ-Stange`},{id:`Anatomie 🩻-13`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`13) Wie ist die „athletische Grundhaltung“ definiert?`,answer:`- Definition
  - Schulterbreiter Stand & Zehen leicht nach außen gedreht
  - Knie Leicht gebeugt (nicht durchgestreckt) und über den Fußspitzen ausgerichtet
  - Becken in Neutralstellung (kein Hohlkreuz, kein Rundrücken)
  - Leichte Aktivierung der Rumpfmuskulatur
  - Rücken gerade, Brust leicht heraus
  - Schulterblätter leicht nach hinten unten gezogen
  - Kopf in Verlängerung der Wirbelsäule
- Funktion
  - Gibt Balance und Stabilität
  - Schützt die Gelenke (v. a. Knie und Wirbelsäule)
  - Ermöglicht schnelles Reagieren (Sprung, Sprint, Richtungswechsel)
  - Universelle Basis in vielen Sportarten (z. B. Ballspiele, Kampfsport, Fitnessübungen)`},{id:`Anatomie 🩻-14`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`14) Methodischer Aufbau Kniebeuge - stichwortartig`,answer:`1. Position einnehmen: Schulterbreiter Stand, Zehen leicht außen rotiert, Rumpf aktiviert, Rücken neutral, Brust aufrecht, Gewicht auf der ganzen Fußsohle, Schultern zurück, Blick nach vorne
1. Abwärtsbewegung: Hüfte nach hinten schieben + Knie beugen, Tiefgehen bis Oberschenkel mindestens parallel zum Boden (bzw. so tief wie möglich ohne die Form zu verlieren), Knie und Zehen immer in einer Linie + Rücken gerade und Rumpf angespannt
1. Aufwärtsbewegung: Beine wieder strecken, Druck über die Fersen nach oben, Knie nicht überstrecken
Häufige Fehler: Knie fallen nach innen oder zu weit nach außen, Rücken rund, Hohlkreuz, Fersen heben ab, Asymmetrische Belastung auf einem Bein`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-1`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 1: MOTORISCHE GRUNDAUSBILDUNG - Die langfristige Entwicklung einer besonderen Bewegungskompetenz`,question:`Welche Bedeutung hat eine sehr gute koordinative Ausbildung im Kindesalter für das spätere (Alltags-) Leben bzw. für eine hochleistungsorientierte Sportkarriere?`,answer:`- Es prägt und limitiert die weitere Trainierbarkeit sowie das erreichbare Leistungspotenzial und Leistungsfähigkeit
- Schon vor Geburt wichtig (motorische Interaktion, Ausdauertraining, …)
- Im Kindesalter ist die Plastizität des Gehirns und die Lernfähigkeit am größten
- Entwicklung der Motorik ist von Vielfalt, Qualität, Intensität und Umfang abhängig
- Motorische Stadien sollten ausreichend erlebt werden und nacheinander ablaufen
- Breiten Bewegungsschatz aufbauen (koordinative Grundlagen und Fertigkeiten)
- Variation ist wichtig: Untergründe, Geräte, Gefühle
  - Man erlernt dadurch: Wassergefühl, Ballgefühl, Sprung, Schwung, Wurf, Lauf, Gleit
- Spielerisch näher bringen: Fangen, Klettern, Springen, Ballspiele, Schaukeln, Rollen, Gleichgewicht halten
Vorteile
- Je breiter die Grundkompetenzen im Kindesalter entwickelt werden, desto leichter wird es im späteren Leben
- Falls man eine Karriere als Hochleistungssportler anstrebt, ist es ebenfalls von großem Vorteil, wenn man eine sehr gute Basis, also vielseitige koordinative Grundkompetenzen besitzt
- höhere Leistungsfähigkeit in Beruf, Freizeit und Sport
- höhere Akzeptanz in Gruppen
- besseres Körperempfinden
- höherer Selbstwert
- umfassende Gesundheitssicherung und Verletzungsprophylaxe
- höhere Ökonomie und Effizienz
- Steigerung der Lebenserwartung
Klaus:
- Alltag: Eine Person die in ihrer Kindheit viele Sportarten kennen gelernt hat und einen breiten „Bewegungsschatz“ aufgebaut hat wird sich immer leichter tun neue Sportarten zu erlernen und wird in diesen schneller zu einem Kompetenzerleben und Anerkennung kommen weshalb sie mehr Sport treiben und gesünder leben wird.
- Hochleistungssport: Auf diesem Bewegungsschatz baut das Bewegungsgefühl auf. Dieses ergibt sich durch vielfältige Variationen mit erstem Sportgeräte- und Technikbezug (z.B. Laufgefühl, Schlaggefühl, Wassergefühl…). Basis + Bewegungsgefühl = Ausgangslage für spätere Technik und Leistung.`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-2`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 1: MOTORISCHE GRUNDAUSBILDUNG - Die langfristige Entwicklung einer besonderen Bewegungskompetenz`,question:`Side Note: In welchem Alter sollten Kinder sportliche Fähigkeiten beherrschen`,answer:`- Radfahren: 3-4 Jahre
- Skifahren: 3-5
- Rolle vorwärts: 4-6 Jahre
- Schwimmen: 4-6 Jahre
- Seilspringen: 5-7 Jahre
- Jonglieren: 6-9 Jahre
- Handstand: 6-10
- Gewichtheben: 7-11`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-3`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 1: MOTORISCHE GRUNDAUSBILDUNG - Die langfristige Entwicklung einer besonderen Bewegungskompetenz`,question:`Side Note: Welche Sportarten sollten Kinder gelernt haben?`,answer:`- Unbedingt: Ballsport, Schwimmen, Geräteturnen
- Sinnvoll: Leichtathletik, Kampfsport
- Ergänzend: Wasserspringen, Snowboard, Golf`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-4`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 1: MOTORISCHE GRUNDAUSBILDUNG - Die langfristige Entwicklung einer besonderen Bewegungskompetenz`,question:`Side Note: Was für Geräte sollten Kinder zur Verfügung haben?`,answer:`- Natur: Bäume, Bäche
- Spielplätze und Motorikparks
- 3-D-Klettergerüst: Klettern, Hangeln, Hängen, Hochziehen, ..
- Bälle und Wurfgeräte: Fußball, Handball, Basketball, … → Schießen, Fangen, Werfen, Rollen, Zielen
- Tore/Blöcke: Zielen, Schießen, Werfen
- Gleichgewicht: Wippen, Wackelplatten
- Rutschen/Schaukeln
- Schläger: Tennis, Badminton, …
- Räder und Rollen: Rad, Skateboard, … → Rollen, Schieben, Treten
- Schneesport: Ski, Bob, Snowboard → Gleiten, Schwingen, Springen, Landen, Bremsen
- Musik: Flöte, Gitarre, Schlagzeug → Rhythmus, Fertigkeiten`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-5`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 1: MOTORISCHE GRUNDAUSBILDUNG - Die langfristige Entwicklung einer besonderen Bewegungskompetenz`,question:`Kann man Vielseitigkeit auch übertreiben? Diskutieren Sie diese Thematik unter Berücksichtigung unterschiedlicher Zielstellungen (Hochleistungssport, Gesundheit, Fitness etc…)`,answer:`- Man kann natürlich immer übertreiben und nicht der Beste in allem sein → unmöglich, dass man unbeschränkt koordinative Kompetenzen, Fertigkeiten und sportliche Techniken auf gleich hohem Niveau beherrscht
- Zuviel Vielseitigkeit führt zu einer Leistungsminderung in einem speziellen Bereich
- Im Hochleistungssport noch relevanter als im Hobbysport / Fitness Bereich
- Die Frage, wann und in welcher Form eine Spezialisierungterfolgen sollte, kann nicht eindeutig beantwortet werden, da abhängig von der absolvierten Grundausbildung, vom Alter, vom biologischen Entwicklungsstatus, vom Talent, von der ins Auge gefassten Sportart und von den organisatorischen Rahmenbedingungen völlig unterschiedliche Spezialisierungszeitpunkte sinnvoll sind
- Je mehr Technikanteile eine Sportart besitzen, umso früher sollte eine Spezialisierung erfolgen.
- In technomotorischen Sportarten muss daher schon das Volksschulalter in einem hohen zeitlichen Ausmaß für die methodische Ausbildung der Techniken verwendet werden.
- Für potenzielle Ausdauerathleten kann eine breite motorische Grundlagenarbeit mit viel Koordination und Schnelligkeit durchaus lange eingesetzt werden;`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-6`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 1: MOTORISCHE GRUNDAUSBILDUNG - Die langfristige Entwicklung einer besonderen Bewegungskompetenz`,question:`Was versteht man unter Interferenz und Transferenz, bezogen auf die Ausübung von mehreren Sportarten bzw. Disziplinen? Nennen Sie Beispiele.`,answer:`1. Interferenz → Sportarten die sich gegenseitig im Weg stehen (negativ beeinflussen) → Golf & Tennis, Laufen & Radfahren
  - z.B. warum werden Schwimmer keine Wasserballer? → weil sie keinen Körperkontakt mögen
1. Transferenz → Sportarten die sich gegenseitig begünstigen → Snowboarden & Surfen, Sprinten & Fußball
1. Bei Rückschlagsportarten (z.B. Tennis, Tischtennis, Badminton) gibt es sowohl Transferenz- als auch Interferenzaspekte`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-7`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`3x5 Konzept bzw. 3x8 Konzept`,question:`In welchem Alter und unter welchen Voraussetzungen können sportliche Techniken bereits auf Weltklasseniveau ausgeführt werden? In welchen Sportarten regulieren Zulassungsbestimmungen einen Start bei Großwettkämpfen?`,answer:`- Bereits ab 12-13 Jahren, da neurophysiologische Entwicklung abgeschlossen
  - 13-jähriger Engländer Europameister im Wasserspringen (10m Turm)
- Solange keine hohen Maximalkraftanforderungen notwendig sind
  - Bei Hochsprung 24 Jahre
  - Bei Weitsprung 26 Jahre
  - Da Sprungkraft entscheidend ist
- Turnen hat aufgrund des günstigen Kraft-Last-Verhältnis bei manchen Kindern ein Mindestalter von 16 Jahren`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-8`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 6: DIFFERENZIELLES LERNEN UND TRAINIEREN - Eine Zusammenfassung`,question:`Beschreiben Sie die Unterschiede zwischen traditionellen Formen des Lehrens und Lernens und dem differenziellen Lernansatz.`,answer:`| Traditionelles Lernen | Differnezielles Lernen |
| --- | --- |
| Fehler meiden | Fehler als Voraussetzung fürs lernen |
| Bewegungsabläufe wiederholen & automatisieren | Adaptionsfähigkeit erhöhen |
| Idealtechnik | Differenzen nutzen und probieren |
| Nächster Schritt erst, wenn vorhiger beherscht wird | Ständig neue und unterschiedliche Aufgaben oder Situationen |
| Lernen durch wiederholen | Bewegungen unterliegen ständigen Schwankungen und können nicht (exakt) wiederholt werden |
| Abweichung vom Ideal nach und nach verringern bis Zieltechnik erreicht ist |  |
| Kontrolle | Selbstorganisation |`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-9`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 6: DIFFERENZIELLES LERNEN UND TRAINIEREN - Eine Zusammenfassung`,question:`Charakterisieren Sie die 3 Variationsprinzipien anhand praktischer Beispiele.`,answer:`Variation
1. „Variation der Bewegung“:
  - bei Tennis mit Schläger mal sehr schnell schlagen, mal sehr langsam
  - veränderte Ausholbewegung
  - bewusst schlechter Ballwurf
1. „Variation im sensorischen Feedback“:
  - visuell: mit Sonnenbrille trainieren, Licht/Schatten Wechsel
  - akustisch: mit Kopfhören (Fluglärm, Störungen)
  - taktil: mit unterschiedlich harten Bällen
  - kinästetisch: mit Socken auf Holzboden
1. Variation der Rahmenbedingungen
  - Unterlagen: Sand, Teppich, Wiese
  - Ausrüstung: Schläger, Bälle, Schuhe
  - Äußere Widerstände: Gewichtsmanschetten, Schläger erschweren
  - Regelwerk: Spielsituation erschweren oder erleichtern
Beispiel Beachvolleyball:
- Bewegungsablauf: mal nur von unten Aufschlag, mal nur von oben, weiter zurück gehen, nach links oder rechts
- Sensorischen Feedback: Schatten/Licht Wechsel, mit Kopfhörer spielen
- Rahmenbedingungen: Halle oder Sand, anderer Ball, nach jeder Berührung die Position wechseln`},{id:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)-10`,topic:`Angewandte Bewegungslehre (ausgearbeitet → lernen und Buch lesen)`,section:`KAPITEL 6: DIFFERENZIELLES LERNEN UND TRAINIEREN - Eine Zusammenfassung`,question:`Welche Grundsätze könnte man das differenzielle Training ableiten?`,answer:`1. Ungewohnte neue Aufgaben → provozieren und unter Druck setzen, um schneller zu reagieren → schnelleren Adaptionsfähigkeit
1. Übung nur so lange wiederholen bis die Ausführung stabil ist
1. Athleten dürfen weder konstant überfordert, noch unterfordert werden
1. Variieren und anspruchsvolle Reize setzen → wachhaltend und emotional → spaßig/emotional erlernte Reize bleiben länger
1. Planmäßig Variieren nicht planlos!
1. Keine Angst vor Fehlern! → Fehler zu machen sind Teil des Lernprozesses und der Weiterentwicklung
Jan Kollamnn → „Differenzielles lernen ist immer als Zusatz zum Klassischen lernen zu sehen und keine alleinige Zaubermethode“`},{id:`Angewandte Trainingslehre-1`,topic:`Angewandte Trainingslehre`,section:`Trainingslehre und Trainingswissenschaft:`,question:`Was versteht man unter Trainingslehre und wie lässt sie sich unterteilen?`,answer:`- stellt eine geordnete und systematische Sammlung handlungsrelevanter Aussagen zum Thema Training dar
- beschäftigt sich mit den Fragen WAS, WIE, WO, WANN, WOMIT, WIE OFT trainiert werden soll
- die Quellen beziehen sich aus Erfahrung von Trainern, Sportmedizin, Trainingswissenschaft, Pädagogik, Biomechanik, Soziologie, Psychologie und Technologie
- lässt sich unterteilen in
  - Allgemeine Trainingslehre: unabhängig von Niveau und Sportart, geschlechtsneutral → Grundlagen und Basis
  - Spezielle Trainingslehre: spezifische Sportart`},{id:`Angewandte Trainingslehre-2`,topic:`Angewandte Trainingslehre`,section:`Trainingslehre und Trainingswissenschaft:`,question:`Welchen Zweck kann die Trainingswissenschaft für einen/eine Trainer/-in haben?`,answer:`- beschäftigt sich mit der Evaluierung/Bewertung der Trainingslehre
- dient zur Optimierung und Ergänzung für die Praxis → unterstützend
- hilft bei
  - Analyse der Anforderungen für eine Sportart
  - Bewertung und Analyse von Wettkampfleistungen
  - Bewertung und Analyse von Trainingsleistungen
  - Evaluierung des Trainings
- liefert Begründungen für den Trainer
- oft Unterschied zwischen Theorie und Praxis → Mensch ist komplex`},{id:`Angewandte Trainingslehre-3`,topic:`Angewandte Trainingslehre`,section:`Trainer/-in:`,question:`Erörtern Sie die staatlichen Ausbildungsebenen der Trainerausbildung.`,answer:`- Übungsleiter → Assistent im Training, Organisation in Verbänden
- Instruktor → Experte für Trainingseinheiten
- Trainer → Experte für Trainingsprozesse
- Sportlehrer → Experte für Trainingsprozesse im Fitness und Breitensport
- Spezialtrainer → Experte für sportartenspezifische Jahrestrainingsplanung
- Diplomtrainer → Experte für mittel und langfristigen Trainingsprozess in der jeweiligen Verbandsstruktur`},{id:`Angewandte Trainingslehre-4`,topic:`Angewandte Trainingslehre`,section:`Trainer/-in:`,question:`Welche Rollen hat ein/eine Trainer/-in?`,answer:`- zentrale Ansprechperson → betreut, berät, informiert, motiviert, analysiert, reflektiert
- Feststellen Ist- und Sollzustand
- Planung, Durchführung und Kontrolle des Trainings
- Konzepterstellung
- Betreuung im Training, Wettkampf, Trainingslagern, …
- Bezugsperson: Vorbild, Freund, Lehrer, Ratgeber, Manager, Motivator
- Funktionär im Verein
- Wissensvermittler`},{id:`Angewandte Trainingslehre-5`,topic:`Angewandte Trainingslehre`,section:`Trainer/-in:`,question:`Welche Aufgaben/Funktionen sollten Übungsleiter/-innen, Instruktoren/Instruktorinnen, (Dipl.-)Trainer/-innen im Verein/Verband haben?`,answer:`- Übungsleiter: Assistenzfunktion im Training
- Instruktor: Training + kurzfristige Planung
- Trainer: Training + mittel- und langfristige Planung und Konzeption, Bezugsperson, Wettkampfplanung und Coaching
- Diplomtrainer: Trainerausbildung`},{id:`Angewandte Trainingslehre-6`,topic:`Angewandte Trainingslehre`,section:`Training`,question:`Was bedeutet Training?`,answer:`- systematische und planmäßige Vorgehensweise, um die sportliche Leistungsfähigkeit zu stabilisieren, zu erhalten, zu steigern oder wiederherzustellen
  - systematisch = Technik, Koordination, Regeneration, Psyche wird inhaltlich, zeitlich und belastungsdynamisch aufeinander abgestimmt → anhand von Trainingswissenschaften, Erfahrungen, …
  - planmäßig = Vorhandensein der angesprochenen Trainingskonzepte
  - steuern = gezielte Beeinflussung des Leistungszustandes, um Ziel zu\xA0 erreichen
- regelmäßig Reize setzen, um ein Ziel zu erreichen
- Belastung + Beanspruchung → führt zur Anpassung der Organe und Funktionssysteme
- Trainingsprinzipien, Steigerung, Arten, …`},{id:`Angewandte Trainingslehre-7`,topic:`Angewandte Trainingslehre`,section:`Training`,question:`Welche Trainingsanpassungen kennen Sie und wie treten sie auf? S.57`,answer:`- Strukturell: Hypertrophie (Dickenwachstum der Muskelzelle) und Hyperplasie (Vermehrung der Muskelzellen)
- Funktionell: intermuskuläre (Zusammenspiel der Muskeln, Agonist, Antagonist, Synergist, Synchronisation → Verbesserung\xA0 durch gute Technik) und intramuskuläre Koordination (mehrere Muskeln\xA0gleichzeitig aktivieren → Maximalkraft)
- Energetisch: Kapillarisierung, Regeneration, Laktattoleranz, Glykogenspeicher, Mitochondrien`},{id:`Angewandte Trainingslehre-8`,topic:`Angewandte Trainingslehre`,section:`Training`,question:`Beschreiben Sie die verschiedenen Anwendungsfelder des Trainings.`,answer:`- Unterschiede in:
  - Zweck (Präventiv, Rehabilitation, Hochleistung)
  - didaktisch-methodische Aspekte (Grundlagen, Aufbau, Hochleistung)
  - Alter der Zielgruppe (Kinder, Jugend, Erwachsene)
  - Organisation (Einzel, Team, Gruppe)
  - Leistungskomponenten (Kondition, Kognitiv, Technik)
  - konditionellen Fähigkeiten (Kraft, Schnelligkeit, Ausdauer, Beweglichkeit)
  - kognitiven Bereich (mentale, observativ),
  - Sportart (Laufen, Schwimmen, Werfen, …)
- Schulsport (Spaß, Vielfalt, Ausdauer, Koordination), Breitensport (Präventiv, Vereine, soziales), Gesundheitssport (Krafttraining mit Senioren, Reha nach Verletzungen), Leistungssport (nicht immer Spaß, nicht immer gesund)`},{id:`Angewandte Trainingslehre-9`,topic:`Angewandte Trainingslehre`,section:`Training`,question:`Was ist ein Trainingsziel und wie lässt es sich kategorisieren?`,answer:`Ziel = Erwartung vom Training → Ergebnis
Allgemeine Ziele sind Verbesserung/Erhalt/Wiederherstellung oder Reduktion der\xA0 Leistungsfähigkeit.
Es gibt
- Hauptziele\xA0(mittel/langfristig)
- und Teilziele (kurz/mittelfristig)
- z.B.: Hauptziel (Kniebeuge mit\xA0 90kg) → Teilziel (Technik Kniebeuge, Kniebeuge mit 50kg)
Ziele unterscheiden sich je nach Anwendungsfeldern:
- Leistungssport → Maximierung\xA0der Leistungsfähigkeit
- Fitnesssport → Prävention
- Rehasport → Defizite kompensieren
- Alterssport → Leistungsabfall verlangsamen`},{id:`Angewandte Trainingslehre-10`,topic:`Angewandte Trainingslehre`,section:`Training`,question:`Was sind Trainingsart, inhalte, -mittel, - methoden und -form?`,answer:`- Trainingsart: Kondition (Ausdauer, Kraft, Beweglichkeit), Taktik (Strategische Übungen), Technik, Mentales, Wettkampfspezifisch, Koordination (Gleichgewicht)
- Trainingsinhalte: die Tätigkeit die im Training ausgeübt wird
  - allgemeine entwickelnde Übung: Kniebeuge
  - spezifische Übung: Steigsprung
  - Wettkampfübung: Weitsprung
- Trainingsmittel: Gerät oder Maßnahme
  - organisatorischer Art: Spuranlagen
  - informativer Art: Bewegungserklärungen
  - Gerätemäßiger Art: Gewichtswessen, Hanteln
- Trainingsmethoden
  - Dauermethode → ohne Pausen
    - kontinuierlich: Laufen, Radfahren, Schwimmen
    - variabel: Tempowechsel, Spielsportarten
  - Intervallmethode → Wechsel zwischen Belastung und Pause
    - Kurz, Mittel oder Lang: HIIT, Koordination
  - Pyramidentraining
- Trainingsform
  - Kraft: z.B. Hypertrophietraining
  - Ausdauer: z.B. Grundlage 1
  - Schnelligkeit: z.B. Sprints
  - oder Einzel, Gruppen, Online, Präsenztraining?`},{id:`Angewandte Trainingslehre-11`,topic:`Angewandte Trainingslehre`,section:`Belastung und Beanspruchung`,question:`Erklären Sie den praktischen Unterschied zwischen Belastung und Beanspruchung.`,answer:`- Belastung: Training an sich (wie wird es durchgeführt)
  - Gesamtbelastung: alle Belastungsreize die auf Körper wirken
    - Umfeld: Motivation, Ernährung, Stress, Gesundheit)
    - Training: Intensität, Dauer, Dichte, Umfang
    - Belastungsverträglichkeit: Alter, Geschlecht, Trainingsalter
- Beanspruchung: Belastung führt zur Beanspruchung (wie reagiert der Körper auf Belastung) → Anpassung der Organe und Funktionssysteme → Herzschlag, Laktat, Sauerstoff, Energieumsatz, Kreatinkinase (CK)
- Beispiel: Belastung = Laufen & Beanspruchung = HF erhöht
- Trainingsart = Kraft; Trainingsmittel = Langhantel; Trainingsmethode = Maximalkraft; Trainingsinhalt = Kniebeuge`},{id:`Angewandte Trainingslehre-12`,topic:`Angewandte Trainingslehre`,section:`Belastung und Beanspruchung`,question:`Benennen Sie die Belastungskomponenten unter Zuhilfenahme eines praktischen Trainingsbeispiels.`,answer:`Trainingsbelastung: Dauer (wie lange pro Belastungseinheit), Intensität (HF, % 1RM), Dichte (Verhältnis Belastungszeit zu Erholungszeit), Umfang (Gesamtvolumen → 4 Sätze a 12 Wdh mit 40KG)
Umfeldbelastung: Familie, Arbeit, Ernährung, Schlaf, Stress
Belastungsverträglichkeit: Alter, Geschlecht, Trainingsalter
Gesamtbelastung sind alle Trainingsreize in einer Einheit.
Beispiel Ausdauer vs Kraft
- Intensität: HF 130-140 vs 70% des 1RM
- Dauer: 60 Minuten vs 12 Wdh.
- Dichte: keine Pause vs 3 Minute Satzpause
- Umfang: 12km vs 3 Sätze
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-13`,topic:`Angewandte Trainingslehre`,section:`Überkompensation`,question:`Erörtern Sie das Modell der Super-/Überkompensation.`,answer:`Körper stellt nach einer Trainingsbelastung nicht nur das gleiche Leistungsniveau wieder her, sondern steigert im Verlauf der Erholung (Regeneration) die Leistungsfähigkeit über das ursprüngliche Niveau → Der Körper passt sich an!
Leistungssteigerung = Belastung + Regeneration
Nach einem Belastungsreiz folgt Ermüdung, um Kapazitäten aufbauen zu können und nicht sofort wieder unter Belastung zu gehen. Regeneration muss genauso wie Trainingseinheiten eingeplant werden, um maximale Leistungssteigerung zu erreichen.
Wie lange Regeneration braucht, hängt von Einflussfaktoren ab → Alter, Genetik, etc. Teilweise messbar durch: Ruhepuls, subj. Empfinden, CK, Gewicht, …
Trainingsanpassung abhängig von: Belastung + Ermüdung + Erholung
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-14`,topic:`Angewandte Trainingslehre`,section:`Überkompensation`,question:`Welche Einflussfaktoren wirken beim Modell der Überkompensation?`,answer:`- Art und Intensität des Trainings
- Leistungsfähigkeit (Alter, Geschlecht, Leistungszustand, Psyche,..)
- Regenerative Maßnahmen (aktiv und passiv)
- Genetik
- Positive/negative Umweltbelastungen (Familie, Arbeit, …)`},{id:`Angewandte Trainingslehre-15`,topic:`Angewandte Trainingslehre`,section:`Überkompensation`,question:`Welche praktischen Trainingsauswirkungen hat das Verständnis des Modells der Überkompensation für Sie?`,answer:`Körper kann sich anpassen und besser werden!
Strukturell: Hyperplasie und Hypertrophie → Muskelwachstum
Funktionell: Inter- und Intramuskuläre Koordination → z.B. bessere Technik und Arbeitsweise → Jonglieren
[Abbildung im Wiki]
- Individuelle Planung wesentlich
- Regenerationseinheiten ebenso planen wie Trainingseinheiten → kein schlechtes Gewissen an Restdays
- Vermeidung von Übertraining
- Athleten auch nach subj. Empfinden fragen
- Umweltbelastungen nicht vernachlässigen bei Planung
- Regelmäßig Reize setzen → Körper bildet sich auch selbständig wieder zurück`},{id:`Angewandte Trainingslehre-16`,topic:`Angewandte Trainingslehre`,section:`Trainingsprinzipien`,question:`Welche Trainingsprinzipien kennen Sie?`,answer:`Prinzipien sind Orientierungshilfen für Trainer und geben grundsätzliche Vorgehensweisen vor, um ausgewählte und definierte Trainingsziele mit hoher Effektivität und möglichst hoher Wahrscheinlichkeit zu erreichen.
Prinzipien, um Anpassung auszulösen:
- Trainingswirksamer Reiz (wesentlich für Aufbau, nicht übertreiben --> Verletzungen, schlechtere Regeneration) → Reiz setzen
- Variation des Trainingsreizes (versch. Übungen, versch. Muskelansteuerungen –> mehr Spaß, Plateaus/Motivationsverlust/musk. Dysbalancen vorbeugen,)
- Geplante Belastungssteigerung
- Individualisierte Belastung
Prinzipien, um Anpassung zu sichern
- Kontinuität
- Belastung und Erholung
- Periodisierung (wechselnde Belastung)`},{id:`Angewandte Trainingslehre-17`,topic:`Angewandte Trainingslehre`,section:`Trainingsprinzipien`,question:`Beschreiben Sie die einzelnen Trainingsprinzipien anhand von Beispielen aus der Trainingspraxis.`,answer:`[Abbildung im Wiki]
Auslösen der Anpassung
- Trainingswirksamer Reiz → Bankdrücken 3x8 Wdh mit 80kg
- Variationen des Trainingsreizes → Butterfly zur Abwechslung machen
- Belastungssteigerung → Bankdrücken 3x8 Wdh mit 85kg
- Individualisierte Belastung → Psychische/physische Bedürfnisse beachten → familiäre Probleme → empathischerer Umgang; Verletzung → Training anpassen zb: Intensität bei Krafttraining verringern, Wh. erhöhen → Anfänger sollte mit weniger Gewicht und mehr Wiederholungen starten
Sichern der Anpassung
- Kontinuierliche Belastung → Regelmäßige Belastung
- Belastung und Erholung
  - Belastung – Entlastung gut abgestimmt --> kont. Leistungssteigerung - Reize nicht zu eng planen außer bei Blocktraining (viele Reize in kurzer Zeit, dann längere Regeneration)
  - Erhaltung 1-2x/Woche Krafttraining Training (Fitness –und Gesundheitsbereich)
- Periodisierung → Niemand kann ganzjährig in Höchstform sein –> Belastungswechsel - Vorbereitung – Stabilisation (Wettkampf) – Reduktion (Übergangsperioden) → Deload`},{id:`Angewandte Trainingslehre-18`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Welche positiven Auswirkungen von Krafttraining kennen Sie?`,answer:`- Kraftzuwachs
- Leistungssteigerung
- Steigerung der Schnelligkeit
- Steigerung der Beweglichkeit
- Verbesserte Koordination
- Besseres Aussehen
- Sturzprophylaxe
- Mehr Lebensqualität
- Mehr Selbstbewusstsein
- Erhöhung der Gelenkstabilisierung
- Bessere Haltung (Vorbeugung Dysbalancen)
- Erhöhte Knochendichte
- Gewichtsverlust
- Blutzuckerspiegel Regulation
- Besserer Heilungsvorgang
- Bessere Schutzfunktion (innere Organe, Gelenke)
- Verbesserung Stoffwechsel –und Energiebereitstellungsparameter - Effektive Reha nach Verletzungen
- Versorgung der Gewebestrukturen in Gelenke (Sehnen, Knorpel, Kapsel-Band-Apparat, Faszien und Knochen)`},{id:`Angewandte Trainingslehre-19`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Welche Rolle spielt die sportmotorische Grundeigenschaft Kraft in diversen Sportarten?`,answer:`Kraft spielt in den meisten Sportarten eine große Rolle, da dadurch die Schnelligkeit, (Kraft)-Ausdauer, wie auch die Koordinationsfähigkeit trainiert werden.
- Verletzungsprävention
- Hat immer Einfluss
Es ist ein Mythos, dass Krafttraining langsam macht.
Krafttraining hilft also in viele spezifischen Sportformen und sollte unter keinen Umständen vernachlässigt werden.`},{id:`Angewandte Trainingslehre-20`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Welche Trainingsziele können dem Krafttraining zugeordnet werden?`,answer:`- Mehr Kraft
- Verbesserung Inter- & Intramuskuläre Koordination
- Effektive Reha nach Verletzungen
- Mehr Muskeln
- Beweglichkeit
- Haltung
- Verbesserung der Ausdauer
- Verbesserung der aeroben und anaeroben Energiebereitstellung
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-21`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Warum wird ein Mensch durch Krafttraining stärker?`,answer:`- Verbesserung intramuskuläre (mehrere Muskelfasern gleichzeitig aktivieren) & intermuskuläre (Zusammenspiel Muskeln verbessern → Technik) Koordination
- Energiebereitstellung → Erhöhung Glykogenvorrat, Creatinphosphatvorrat und ATP-Vorrat
- Hypertrophie (Dickenwachstum Muskelzelle)
- Hyperplasie (Vermehrung Muskelzellen)`},{id:`Angewandte Trainingslehre-22`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Ordnen Sie die Methoden des Krafttrainings den Wiederholungen zu.`,answer:`- Maximalkraft (1-5 Wh.)
- Hypertrophie (6-14 Wh.)
- Kraft-Ausdauer (>15 Wh.)
  - Strukturell → 15-20
  - Energetisch → > 20
- Schnell-/Reaktivkraft (6-14 Wh.) schnellstmögliche Ausführung → wenn man langsamer wird → Pause
  - Reaktivkraft → mehr Fokus auf Dehnungsverkürzungszyklus (Dropjumps)`},{id:`Angewandte Trainingslehre-23`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Definieren Sie die Belastungskomponenten beim MK-, KAD-, SK-und Hypertrophietraining.`,answer:`| Spalte 1 | Maximalkraft | Kraftausdauer | Schnellkraft | Hypertrophie |
| --- | --- | --- | --- | --- |
| Intensität | 90-100% | 40-60% | Max. 60% | 60-90% |
| Dauer | 1-5 Wh. | 12-20 Wh. | 6-12 Wh. | 6-14 Wh. |
| Umfang/Volumen | 3-5 Sätze | 3 Sätze | 3-5 Sätze | 1-10 Sätze |
| Tempo | Langsam bis Mittel | Mittel bis schnell | explosiv | langsam-zügig |
| Dichte/Pausen | 3-5 Minuten | 30 - 90 Sekunden | 2-5 Min. | 2-4 Min. |
|  |  |  |  |  |`},{id:`Angewandte Trainingslehre-24`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Welche Besonderheiten beobachten Sie beim Krafttraining mit Senioren/Seniorinnen im Gegensatz zum Krafttraining mit Jugendlichen?`,answer:`Senioren
- Andere Ziele als Jugendliche --> anderes Training --> präventiv, Erhaltung Mobilität, Muskelaufbau/erhalt
- Muskelhypertrophie
  - nimmt ab 30. Lj. ab, 2- 3kg/10 Jahre
  - vorallem FT fasern
  - weniger Gelenksschutz, Mobilität, Schnelligkeit
- Osteoporose-Prophylaxe
  - Knochendichte nimmt im Alter ab
  - Abnahme verstärkt sich durch fehlender Zug-Druck-Belastungen, ungünstiger Hormonausschüttung, Entmineralisierung, falsche Ernährung
- Sturzprävention
  - Körperhaltung und koordinative Fähigkeit verbessern
  - vorallem Unterkörper-Training
  - Balanceübungen
- Erhalt von Maximalkraft zur Bewältigung von Alltagssituationen
  - Aufstehen, Aufrichten, etwas aufheben, …
Jugendliche
- Von klein auf verschiede Sportarten spielerisch näherbringen
- Vorrang hat immer Technik, dann Geschwindigkeit, dann Gewicht - Maschinen im FC oft besser als eigenes Körpergewicht --> Gewicht einstellbar, kann weniger Gewicht als eigenes KG verwenden
- Frühes Kindesalter (6-9 Jahre) → Grundlagentraining
  - Koordination
  - Gleichgewicht
  - Technik
  - Körpergewicht
- Spätes Kindesalter (9-13 Jahre) → Aufbautraining
  - Sprungkraft
  - Rumpfkraft
  - Freihantel
- Jugendalter (12-18 Jahre) → Anschlusstraining
  - Sprungkraft
  - Rumpf
  - Maximalkraft
  - Exzentrisches Krafttraining
- Erwachsenenalter (ab 18 Jahre) → Hochleistungstraining
  - Gleichgewicht
  - Sprungkraft
  - Rumpftraining
  - Maximalkraft`},{id:`Angewandte Trainingslehre-25`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Welche Gefahren beim Krafttraining gibt es?`,answer:`- Aufwärmen nicht durchgeführt
- Intensität zu hoch (Verletzung/Übertraining)
- Pausen zu kurz/wenig
- Technik falsch
- Geräteeinstellung falsch
- Spannungsverlust
- Atemtechnik falsch
- Training mit eigenem Körpergewicht (zu intensiv)
- Falsche Bekleidung
- Sicherung (Partner, Geräte)`},{id:`Angewandte Trainingslehre-26`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Sollte Krafttraining mit eigenem Körpergewicht bevorzugt werden?
Wenn nein, warum nicht, und was ist zu beachten?`,answer:`- Es hängt von den Zielen ab → Ja, wenn Ziel erreicht
- Überlegen, welche Inhalt und Methode (z.B. Maximalkraft → ja wenn möglich)
- Schwer dosierbar
  - Kann Maximalkraft übersteigen
    - Nicht gut für Untrainierte, Kinder/Jugendliche
    - Kann zu Verletzungen führen, vorallem bei falscher Technik
  - Bei gut trainierten reicht der Reiz dann oft nicht aus
- Untrainierte haben oft nicht das richtige Körpergefühl, wodurch es mit Geräten einfacher ist
- Vorteile und Möglichkeiten
  - Verbesserung intermuskuläre Koordination
  - Rumpf –und Stützkraft verbessern
  - Technik verbessern
  - Überall durchführbar, keine Geräte nötig`},{id:`Angewandte Trainingslehre-27`,topic:`Angewandte Trainingslehre`,section:`KRAFT`,question:`Erklären Sie den Zusammenhang zwischen Krafttraining und den anderen sportmotorischen Grundeigenschaften (Ausdauer, Schnelligkeit, Beweglichkeit, Koordination).`,answer:`- Ausdauer
  - Kraftausdauer trainieren → dadurch kann man seine Kräfte über eine längere Zeit moderat nutzen → mehr Wdh mit weniger Gewicht
  - Ausdauer für KT sinnvoll → Verbesserung Fettstoffwechsel, Regenerationsfähigkeit, Verletzungsprävention
  - KT für Ausdauersportler sinnvoll → Kraftaufbau gut für Schnelligkeit, Verletzungsprävention, Muskelkraft effizienter nutzen
- Schnelligkeit
  - Schnelligkeit wird durch zwei Hauptfaktoren beeinflusst: die Maximalkraft (die Fähigkeit, maximale Kräfte zu erzeugen) und die Schnellkraft (die Fähigkeit, diese Kräfte schnell zu entwickeln)
  - Krafttraining, insbesondere Explosivkrafttraining, fördert beide Aspekte
  - Mythos, dass Krafttraining langsam macht!
  - Spezifische Übungen wie Sprünge, Sprints mit Widerstand oder plyometrisches Training verbessern sowohl die Schnellkraft als auch die maximale Geschwindigkeit
  - Gute Vorbereitung, aufwärmen nötig
- Beweglichkeit
  - Wesentlich für gutes Krafttraining
  - Wenn Muskeln stärker werden, können sie in einem größeren Bewegungsradius stabiler arbeiten
  - Maximale ROM ausführen → Verbesserung der Beweglichkeit
- Koordination
  - Krafttraining beeinflusst die inter- und intramuskuläre Koordination
    - Stärkt die Fähigkeit, mehrere Muskeln gleichzeitig effizient und in präziser Reihenfolge anzusprechen, was für komplexe Bewegungsabläufe wichtig ist
  - Variantenreiches und funktionelles Krafttraining → verbessert die neuromuskuläre Koordination und trägt dazu bei, die Bewegungsgenauigkeit und -ökonomie zu steigern
  - z.B.: einbeiniges Seitheben am Kabelzug mit einem labilen Untergrund`},{id:`Angewandte Trainingslehre-28`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Auswirkungen auf den Körper (HKS, Muskulatur...) durch das Ausdauertraining kennen Sie?`,answer:`- Anpassung des Herzens
  - Adaption an Trainingsreize → Erweiterung aller Herzkammern und Gefäße
  - Hypertrohpie der Herzmuskulatur → Verdickung
  - Ergebnis: Leistungsfähiger und mehr durchblutet → Ruhefrequenz, Belastungsfrequenz, Blutdruck, Herzratenvariabilität
  - Reduktion HK-Erkrankungen
- Anpassung der Lunge → mehr Lungenvolumen & bessere Sauerstoffaufnahme
- Besserer Transport des Blutes und stärkeres Immunsystem
- Anpassung der Muskulatur
  - Kapillarisierung → Zahl der geöffneten Kapillaren (kleinste Blutgefäße) steigt oder Volumen wird größer → bessere Sauerstoffversorgung
  - Bessere Durchblutung
  - Veränderung der Mitochondrienzahl- und größe in den Muskelzellen
- Erhöhung der Ermüdungswiderstandsfähigkeit
- Erhöhung der Belastungsverträglichkeit
- Stabilisation der Konzentration
- Senkung von Sympathikus Aktivität
- Verletzungsprophylaxe (Reduktion der Ermüdung)
- Bessere Fettverbrennung → Gewichtsreduktion
- Gehirndurchblutung verbessert`},{id:`Angewandte Trainingslehre-29`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Rolle spielt die sportmotorische Grundeigenschaft Ausdauer in diversen Sportarten?`,answer:`- spielt fast überall eine wichtige Rolle → Fähigkeit, körperliche Leistungen über längere Zeiträume hinweg aufrechtzuerhalten, ohne dabei die Leistung stark zu mindern
- Ausdauer umfasst sowohl die aerobe Ausdauer (mit Sauerstoff) als auch die anaerobe Ausdauer (ohne Sauerstoff)
- Ausdauerfähigkeit → rasche Erholung
- Ausdauerleistung → gute Laufzeit über 10km erzielen können
- Unterscheidung in den Sportarten → Ausdauersport (primäre Komponente) → Krafttraining (unterstützende Komponente)`},{id:`Angewandte Trainingslehre-30`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Trainingsziele können dem Ausdauertraining zugeordnet werden?`,answer:`- HK-System verbessern → Sauerstoffversorgung
- Reduzierung von HK-Erkrankungen
- Gewichtsreduktion
- Stärkung des Immunsystems
- Bessere Regenerationsfähigkeit und Belastbarkeit
- Weniger Ermüdung
- Umstellung aerob-anaerobe Energiebereitstellung verbessern
- Verbesserung der anaeroben Schwelle → Längeres Durchhalten hoher Intensitäten
- Laktatkompensation verbessern
- Ruhepuls senken
- Weniger Depression und Angstzustände
- Stressabbau
- Technische Bewegungsstereotypen bessern`},{id:`Angewandte Trainingslehre-31`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Trainingsmethoden im Ausdauertraining kennen Sie?`,answer:`- intermittierend → z.B. Springseil, Plank, Springseil, Plank
- Intervalle → kurz, mittel, langzeit → je kürzer, desto höher Intensität und länger Pauseverhältnis
| Methode | Intensität (% HFmax) | Belastungsdauer | Pause | Ziel / Wirkung | Beispiel |
| --- | --- | --- | --- | --- | --- |
| Extensive Dauermethode | 60–75 % | 30–120 min | keine | Grundlagenausdauer, Fettstoffwechsel | Dauerlauf, Radfahren |
| Intensive Dauermethode | 75–90 % | 20–60 min | keine | Anaerobe Schwelle, Leistungssteigerung | Tempolauf |
| Extensive Intervallmethode | 70–85 % | 1–8 min | 1–3 min | Kapillarisierung, Herzleistung | 6×800 m Lauf |
| Intensive Intervallmethode | 85–95 % | 0.5–2 min | 2–4 min | VO₂max, Laktattoleranz | 10×400 m Lauf |
| Wiederholungsmethode | 90–100 % | 0.5–4 min | 5–10 min | Maximalleistung, anaerobe Kapazität, VO2Max | 4×1000 m Lauf |
| Fahrtspiel | variabel | 30–60 min | keine festgelegt | Motivation, Kombination aus Dauer/Intervall | Lauf mit Tempowechseln |
| Wettkampfmethode | 90–100 % | Wettkampfdistanz | keine | Test & Wettkampferfahrung | 10 km Lauf, Triathlon |`},{id:`Angewandte Trainingslehre-32`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Auswirkung hat die Energiebereitstellung auf die Trainingsbereiche?`,answer:`Die Energiebereitstellung (ATP-Produktion) im Körper erfolgt über drei Hauptsysteme:
| Energiebereitstellung | Art | Dauer | Substrat | Trainingsbereich | Intensität | Beispiele |
| --- | --- | --- | --- | --- | --- | --- |
| Anaerob-alaktazid | kein Sauerstoff nötig, kein Laktat entsteht | 0 – 10 s | Kreatinphosphat (KP) | Schnellkraft, Sprint | ≈ 95 – 100 % HFmax bzw. maximale Intensität | Start, Sprung, Gewichtheben |
| Anaerob-laktazid | ohne O₂, mit Laktatbildung | 10 s – 2 min | Kohlenhydrate | Schnelligkeitsausdauer, Intervalltraining | ≈ 85 – 95 % HFmax | 400 m-Lauf, HIIT, Mittelstrecke |
| Aerob | mit O₂, oxidativer Stoffwechsel | ab ≈ 2 min – mehrere Stunden | Kohlenhydrate + Fette | Grundlagenausdauer, Dauertraining | ≈ 60 – 80 % HFmax | Joggen, Radfahren, Schwimmen |
Es sind alle gleichzeitig aktiv, aber je nach Intensität und Dauer der Belastung wird eines dieser Systeme überwiegend beansprucht.
- Bei kurzen, intensiven Belastungen überwiegt die anaerobe Energiebereitstellung (Kreatinphosphat, Laktatbildung)
- Bei längeren, moderaten Belastungen die aerobe.
→ Diese Systeme bestimmen also, welcher Trainingsbereich (z. B. Grundlagenausdauer, Schwellentraining, Schnelligkeit) trainiert wird.
Zuerst ATP, dann KP, dann je nach Belastung anaerob oder aerob.
Grundannahme: durch die Verstoffwechselung von KH entsteht Pyruvat, welches bei geringer Intensität nicht in Laktat umgewandelt werden muss…mit steigender Intensität jedoch schon…je nach Laktatspiegel im Blut werden Trainingsbereiche Festgelegt da Laktat die Physiologische Beanspruchung widerspiegelt)
WICHTIG → Laktat ist NICHT schlecht…aus Laktat kann Glukose gewonnen werden und es ist ein wichtiger Botenstoff für Anpassungen (ua. Kapiliarisierung)
Rekom → Kein Latatanstieg im Blut (dh wird es im Muskel Kompensiert)
Aerober-Bereich → Laktatanstieg im Blut aber es kann noch im Körper kompensiert werden (=steady state bildet sich bei gleich bleibender belastung)
Anaerob → Es bildet sich kein steady state mehr → Laktat steigt bis zum Abbruch an.
Warum Abbruch bei hohem Laktat wenn es ned schlecht ist? → Weil zusammen mit Laktat Wasserstoffionen entstehen die den PH wert des Muskels senken
| Stufe 1 (Rekom – GA1) | Stufe 2 (GA1-GA2) | Stufe 3 (WSA) Wettkampfspezifische ausdauer |
| --- | --- | --- |
| Max. 65% v. HF | 65-85% v. HF | >85% v. HG |
| Kaum Laktatproduktion | Laktatproduktion/elimination | Laktatproduktion |
| Max. areob | Aerob, Beginn anaerob | anaerob |
| Fettstoffwechsel | FSW + KH-SW | KH-SW |
| Regeneration | Grundlagenausdauer | Entwicklung |
[Abbildung im Wiki]
[Abbildung im Wiki]
Wie man an der o.a. Abbildung erkennen kann, greift der Körper ab einer bestimmten Belastung nur noch auf die Kohlenhydratspeicher zu und stoppt den Fettabbau komplett (ab ca. 75 %).`},{id:`Angewandte Trainingslehre-33`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Trainingsbereiche im Ausdauertraining gibt es und wie werden diese definiert?`,answer:`siehe vorherige Antwort
REKOM→ (unter 65% HF Max und ca 1mmol Laktat)
GA1→ (65-70% HF Max und ca 1-3mmol Laktat)
GA2→ (70-80% HF Max und ca 3-6mmol Laktat)
WSA→ (80-90% HF Max und ca 6-8 mmol Laktat)
SA→ (90-100% HF Max und über 8 mmol Laktat)
| Bereich | HFmax | Gefühl / Wahrnehmung | Typische Belastung | Energiebereitstellung | Ziel / Wirkung |
| --- | --- | --- | --- | --- | --- |
| REKOM (Regeneration & Kompensation) | 50–60 % | sehr leicht, man kann sich locker unterhalten, kein Atemzug tiefer | Spazieren, lockeres Radfahren, leichtes Schwimmen | aerob (Fettstoffwechsel) | Regeneration, Laktatabbau, Durchblutung |
| GA1 (Grundlagenausdauer 1) | 60–70 % | leicht, „locker laufen“, ruhig atmen, Puls niedrig-stabil | langsames Laufen, zügiges Gehen, moderates Radfahren | aerob (v. a. Fette + etwas KH) | Aufbau der Grundlagenausdauer, Fettverbrennung, Herz-Kreislauf-Basis |
| GA2 (Grundlagenausdauer 2) | 70–80 % | zügig, aber noch kontrolliert, du atmest deutlich, aber kannst noch kurze Sätze sprechen | zügiges Laufen, längere Intervalle (z. B. 3×10 min zügig mit Pausen) | aerob → anaerob Übergang | Verbesserung der aeroben Kapazität, Laktatschwelle nach oben verschieben |
| EB (Entwicklungsbereich) | 80–90 % | anstrengend, Atmung deutlich schwerer, „Tempo-Läufe“, man merkt Brennen in den Muskeln | Intervalltraining, Tempodauerlauf, Schwellentraining | aerob + anaerob-laktazid | Verbesserung der anaeroben Schwelle, Laktattoleranz |
| SB (Spitzenbereich) | 90–100 % | maximal, Sprint- oder Wettkampfintensität, kaum noch sprechen, schnelle Ermüdung | Sprint, HIIT, kurze harte Intervalle (z. B. 10×30 s all out) | anaerob (laktazid + alaktazid) | Maximale Leistungsfähigkeit, Schnelligkeit, VO₂max |

[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-34`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Welche Besonderheiten gibt es im Ausdauertraining bei unterschiedlichen Zielgruppen?`,answer:`- Kinde & Jugendliche
  - Spaß an Bewegung & Vielseitigkeit (Laufspiele, Staffeln, Radfahren)
  - keine monotone Dauermethode
  - keine extremen Belastungsumfänge in einem Training (Intensität, Mittel, Geschwindigkeit)
  - Variationsreich bei Kindern/Jugendlichen
  - Spielerisch und schnelligkeitsorientiert → Fangspiele
- Hobbysportler: 4-6h/Woche
  - Regelmäßigkeit wichtiger als hohe Intensität
  - Extensive Dauermethode im Vordergrund (60–75 % HFmax)
  - Gelenkschonende Sportarten bevorzugen (z. B. Radfahren, Schwimmen, Nordic Walking)
  - Gesundheit, Stressabbau, Grundlagenausdauer
- Leistungssportler: 7-12h/Woche
  - Leistungssteigerung und spezifische Anpassung
  - Kombination mehrerer Methoden (Dauer-, Intervall-, Wiederholungsmethode).
  - Hohe Intensitäten (GA2, EB, SB) werden gezielt eingesetzt
  - Laktattests, Pulskontrolle, Trainingszonen
- Ältere Menschen
  - Ziel: Erhalt der Leistungsfähigkeit, Mobilität, Herz-Kreislauf-Gesundheit
  - Beginn mit geringer Intensität (50–65 % HFmax), langsam steigernd
  - Gelenkschonende Formen: Radfahren, Nordic Walking, Schwimmen
  - Längere Aufwärm- und Erholungsphasen nötig.
    → Beispiel: 4× pro Woche 30 min zügiges Gehen oder Aquafitness
- Kranke oder Reha
  - Langsamer Belastungsaufbau mit regelmäßigen Pausen
  - Alltagsnahe Bewegungen (z. B. Gehen, Radfahren, Ergometer)
  - Regelmäßige Kontrolle von Puls, Blutdruck, …`},{id:`Angewandte Trainingslehre-35`,topic:`Angewandte Trainingslehre`,section:`AUSDAUER`,question:`Erklären Sie den Zusammenhang zwischen Ausdauertraining und den anderen sportmotorischen Grundeigenschaften (Kraft, Schnelligkeit, Beweglichkeit, Koordination).`,answer:`Eine gut trainierte Ausdauer erleichtert es einem, in den anderen sportmotorischen Grundeigenschaften gute Fortschritte zu erzielen.
Zumindest sollte eine gute Basis bestehen, wodurch man sich dann auf das Wesentliche in der betroffenen Sportart beziehen kann.
Der Körper wird durch Ausdauertraining allgemein widerstandsfähiger und man kann dadurch besser sportartspezifisch trainieren.
Kraft
- bessere Kraftausdauer
- bessere Sauerstoffversorgung und Nährstoffversorgung der Muskulatur
- bessere Erholung und Regeneration
- Vermeidung von Muskelermüdung
- nicht in selben Einheit trainieren
- Muskelabbau bei zu viel Ausdauer
Schnelligkeit
- Ausdauertraining verbessert die Schnellkraft
- Schnelligkeitsausdauer → 400m Spring
- bessere Belastungsfähigkeit bei hohen Intensitäten
- zu viel wirkt sich negativ aus, da eher die ST Fasern rekrutiert werden
Beweglichkeit
- kein direkter Einfluss
- aber bessere Durchblutung der Muskulatur
- Muskeln und Sehnen können länger in Bewegung sein → weniger Verletzung
- langes und einseitiges Training z.B. Marathon führt zu Verkürzungen und Fehlhaltungen (Läuferknie)
Koordination
- Neuromuskuläre Koordination → die Fähigkeit des Nervensystems, die Muskulatur effizient zu steuern
- Bessere Technik über längere Zeit und bei Ermüdung → Konzentrationsfähigkeit`},{id:`Angewandte Trainingslehre-36`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Definition von Schnelligkeit`,answer:`Die Fähigkeit in kürzester Zeit auf Reize zu reagieren sowie Bewegungen im Sport mit höchstmöglicher Geschwindigkeit auszuführen
Sie hängt von mehreren Faktoren ab, die morphologisch (körperlich), neuromuskulär und koordinativ bedingt sind.`},{id:`Angewandte Trainingslehre-37`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Von welchen Faktoren können Schnelligkeitsleistungen abhängig sein?`,answer:`1. Anlage-, entwicklungs-, lernbedingte Einflüsse: Alter, Körperbau, Genetik,…
1. Kognitiv-psychische Einflüsse: Reaktion, Erfahrung, Antizipation, Motivation, Wissen, Konzentration…
1. Sensomotorische Einflüsse: Technik, Zeitprogramme, Reflexe (Dehnungs-Verkürzungszyklus), Rhytmus
1. Muskuläre & Strukturelle Einflussgrößen: Kraft, Faszien, Muskelfasern, Energiebereitstellung, Muskelquerschnitt
1. Biomechanische und technische: Impulsübertragung, Hebelverhältnisse, Rotationsgeschwindigkeiten
1. Trainingsmethodische: Aufwärmen, Bewegungseinschränkungrn, Schmerzbilder`},{id:`Angewandte Trainingslehre-38`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Welche Ziele verfolgt man durch ein Schnelligkeitstraining (in Ihrer Sportart)?`,answer:`Fähigkeit zu verbessern, möglichst rasch auf Reize zu reagieren und Bewegungen mit höchster Geschwindigkeit und präziser Technik auszuführen
- Eigenen Körper beschleunigen
- Sportgerät beschleunigen
- Auf unterschiedliche Reize unterschiedlich reagieren
- Schnelligkeitsleistungen ohne Geschwindigkeitsverlust zu realisieren und wiederholen
- Verkürzung der Reaktionszeit
- Erhöhung der Bewegungsgeschwindigkeit
- Verbesserung inter und intramuskuläre Koordination
- Steigerung der Explosiv- und Startkraft
- Verbesserung der Technik unter maximaler Geschwindigkeit
Sportartenspezifische Bewegungen schnell anwenden, ein Sportgerät beschleunigen, ein Körperteil beschleunigen, schnell auf Reize reagieren, Schnelligkeitsleistungen lange aufrecht halten/ oft wiederholen können mit geringem leistungsverlust.`},{id:`Angewandte Trainingslehre-39`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Benennen und beschreiben Sie die wichtigsten allgemeinen methodischen Überlegungen beim Schnelligkeitstraining.`,answer:`- Elementare Schnelligkeit: Reaktion, Aktion, Frequenz (Tapping) → Nervensystem
- Komplexe Schnelligkeit: Handlungsschnelligkeit mit Technik & Taktik verbunden, Schnellkraft, Schelligkeitsausdauer
- Quali vor Quanti
- Lange Pausen
- nur in Ausgeruhtem zustand und mit → Vollständige Erholung zwischen WIederholungen → nur ausgeruht ist wahre Schnelligkeit
- Maximale Intensität
- Kurze Belastungszeiten
- Hohe Konzentration
- Ganzjährig Planen
1. koordinativer Ansatz: Einzelübung unter Zeitdruck
1. neuromuskulär: Handlung schneller als normal möglich (Langhantel ohne Gewicht schnell stemmen)
1. handlungsspezifisch: Fußball z.B. zu einem Punkt sprinten, abbremsen und zum anderen Punk
1. konditionell: intramuskuläre Koordination verbessern
1. energetische: Energiebereitstellung verbessern`},{id:`Angewandte Trainingslehre-40`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Beschreiben Sie ein Schnelligkeitstraining nach dem koordinativen Ansatz.`,answer:`Verbesserung durch koordinative Übungen unter Zeitdruck. Spielerisch, frequenzbetont und unbemerkt. → Koordination unter Zeitdruck → Reifenbahnen
- Verbesserung durch koordinative Übungen durch ZEITDRUCK
- Spielformen, Frequenzleiter, Reifenkoordination, Würfe
- auf der stelle treten → Nähmaschine → 6-12 Wiederholungen jeweils 3 Sekunden
- Reize variieren
- Kurze, präzise Belastungen
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-41`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Beschreiben Sie ein Schnelligkeitstraining nach dem handlungsspezifischen Ansatz.`,answer:`- Erfahrung, Antizipation, Wahrnehmung
- einbindung schneller handlungen ins technik oder taktiktraining
- technikorientiert: antritt, richtungsänderungen, finten
- taktikorientiert: komplexe bewegungsaufgabe
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-42`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Beschreiben Sie ein Schnelligkeitstraining nach dem neuromuskulären Ansatz.`,answer:`Abläufe schneller ausführen als unter normalen Umständen. Schneller als normal möglich.
1. Zeitprogramm
1. bewegungsabläufe isoliert schneller ausführen als unter normalen bedienungen → schneller als normal möglich
1. bergabläufe, frequenzübungen unter leichteren bedingungen, übungen unter körpergewichtsentlastung
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-43`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Beschreiben Sie ein Schnelligkeitstraining nach dem konditionellen Ansatz.`,answer:`- Maximalkrafttraining (intramuskuläre Koordination)
- Schnellkrafttraining (intermuskuläre Koordination)
- Gesprungene Kniebeuge, explosive Ausführung
[Abbildung im Wiki]`},{id:`Angewandte Trainingslehre-44`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Beschreiben Sie ein Schnelligkeitstraining nach dem energetischen Ansatz.`,answer:`- Entwicklung von energiebereitstellenden Prozessen → Ausdauertraining
- Kontinuierliche Schnelligkeitsausdauer (durchgehend, einmalig –> 1000m Sprint)
[Abbildung im Wiki]

[Abbildung im Wiki]
Notizen vom Kurs:
- Turnhalle → Aufwärmübungen mit Tennisball → Koordination + Aufwärmen + Spielerisch
- Mit Fuß, mit Händen, dribbeln, blind, jonglieren`},{id:`Angewandte Trainingslehre-45`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Was bewegt uns sportlich zu sein?`,answer:`- sich selbst herausfordern / etwas schaffen
- Glücksgefühle
- Auf etwas hintrainieren
- Neues Lernen
- Gemeinschaft
- Motive im Sport → sportunterricht.de/lksport/motive2.html
- Aufwärmen
- Allgemein / Speziell
- Volle Bewegungsamplitude
- Körpertemperatur erhöhen, Stoffwechsel beschleunigen, Verringerung der Gelenksbelastung / Reibung, Sauerstoffaufnahme verbessern`},{id:`Angewandte Trainingslehre-46`,topic:`Angewandte Trainingslehre`,section:`SCHNELLIGKEIT`,question:`Was kann man trainieren?`,answer:`- Kraft
- Ausdauer
- Beweglichkeit
- Schnelligkeit
- Koordination`},{id:`Sportbiologie-1`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Was ist ein Muskel?`,answer:`- kontraktiles Organ, welches durch die Abfolge von Anspannung/Erschlaffung, innere und äußere Strukturen des Organismus bewegen kann
- Nervenimpuls vom ZNS → Kontraktion/Relaxation von Muskelfasern`},{id:`Sportbiologie-2`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Nennen Sie Muskeltypen`,answer:`- Spindelförmig → Biceps brachii
- Einfach gefiedert
- Mehrfach gefiedert
- Sägemuskel → serratus anterior
- 1-bäuchig → bizeps
- Mehrbäuchig → rectus abdominis
- 1-köpfig → pect major
- 2-köpfig → bizeps femoris
- 3-köpfig → trizeps
- 4-köpfig → quadriceps femoris
- 1-gelenkiger → deltoideus
- 2-gelenkiger → gastrocnemius
- 3-gelenkiger`},{id:`Sportbiologie-3`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Was sind Agonist, Antagonist, Synergist?`,answer:`- Agonist → Haupstpieler → Bizeps
- Antagonis → Gegenspieler → Trizeps
- Synergist → Mitspieler → brachioradialis und brachialis`},{id:`Sportbiologie-4`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Arten der Kontraktion?`,answer:`- Isometrische → haltend → Ursprung und Ansatz bleiben gleich → Spannung nimmt zu → 1, 3, 5
- Konzentrische → überwindend → Ursprung und Ansatz nähern sich an → grün 2, 4 → Muskel verkürzt sich
- Exzentrische → nachgebend → Ursprung und Ansatz entfernen sich → rot 2, 4 → Muskel verlängert sich trotz Spannung
[Abbildung im Wiki]`},{id:`Sportbiologie-5`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Muskelarten`,answer:`- Skelettmuskulatur → willkürlich steuerbar, ermöglicht Bewegung
- Glatte Muskulatur → unwillkürlich → Muskulatur der Eingeweide → vegetatives NS
- Herzmuskel → unwillkürlich`},{id:`Sportbiologie-6`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Wichtige Muskelstrukturen`,answer:`- Schleimbeutel → Flüssigkeitsgefüllte Kissen → Druckverteilung und Reibungsminderung
- Faszien → Derbe Bindegewebshühle (Kollagenfasern) → umhüllen Muskulatur
- Sehnenscheiden → Bindegewebige Kanäle in welchen Sehnen verlaufen → Reibungsminderung
- Sesambein → in Sehnen eingelagerte Knochen → Kniescheibe`},{id:`Sportbiologie-7`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Aufbau der Muskulatur`,answer:`Motorische Einheit: Nerv plus dazugehörige Muskelfaser
Sarkomer: kleinste kontraktile Einheit zwischen 2 Z-Scheiben
[Abbildung im Wiki]`},{id:`Sportbiologie-8`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Kontraktion`,answer:`- midochondien produzieren ATP
- wenn zuviel laktat und ich übersäure dann weniger atp darum weniger bewegung, weil körper säure basen haushalt regulieren möchte
- ATP sitzt an Myosin -> Calcium aktiviert die ATP-ase, Myosin kippt, ATP wird zu ADP, neues ATP kommt hinzu, Myosin richtet sich auf
- Myosin zieht durch Kippbewegung des Köpfchens zur Sarkomermitte => Verkürzung der Muskulatur
- Kontraktion benötigt: Calcium (Ca2+) und ATP (Adenosintriphosphat)
- Für jede Kontraktion wird APT benötigt → Adenosintriphosphat
- 3 Arten der Bereitstellung
  - Anaerob-alaktazid → ATP, KP
  - Anaerob-laktazid → KH
  - Aerob → Zellatmung (KH und Fette)
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Sportbiologie-9`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Muskelfasertypen`,answer:`- Fast Twitch → Schnellkraft, Maximalkraft
  - 2a bzw 2c → Kontraktionszeit 100ms → geringe Ermüdbarkeit
  - 2b → Kontraktionszeit 40ms → hohe Ermüdbarkeit
- Slow Twitch (Tpy 1) → Kraftausdauer → langsame Arbeit mit geringer Intensität
- Faserzusammensetzung ist genetisch vorgegeben → Training ermöglicht Verschiebung von 2b zu 2a und 2x → Ausdaueradaptierung
- Anteil ist genetisch -> wenn ein Kind viele ST hat dann eher Ausdauerathlet; wenn viel FT dann eher Kraft und Schnelligkeit
- Es geht von Sprinter zu Ausdauer aber nicht von Ausdauer zu SPrinter
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Sportbiologie-10`,topic:`Sportbiologie`,section:`Aktiver Bewegungsapparat`,question:`Energiebereitstellung`,answer:`- anaerob-alaktazid
  - ATP → ADP + Pi + freie Energie → ATP Speicher für 1-2sec
  - ADP + KP → ATP → für 6-8sec
- anaerob-laktazid
  - Glucose → 2 Pyruvat + 2 ATP + 4 H+
  - Pyruvat → Lactat umgewandelt → Abbruch der körperlichen Aktivität
  - Belastung bis ca 90 sec
  - PH Wert im körper 7,3-7,4
- aerob
  - Glucose/Lipide + O2 → CO2 + H20 + 38APT
  - Glucose wird als Glykogen im Muskel/Leber gespeichert → Training = Vergrößerung der Speicher → Belastung bis ca. 90 Minuten
  - Lipide → größte Quelle → Belastung bis mehrere Tage
[Abbildung im Wiki]
[Abbildung im Wiki]
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Sportbiologie-11`,topic:`Sportbiologie`,section:`Zellen`,question:`Was ist eine Zelle?`,answer:`- kleinste lebende Einheit des Körper
- alles was lebt besteht aus Zellen (Menschen, Tiere, Pflanzen)
- Baustein jedes Gewebes (Muskel, Knochen, Sehnen, Bänder, Nerven, …)`},{id:`Sportbiologie-12`,topic:`Sportbiologie`,section:`Zellen`,question:`Welche Aufgaben haben Zellen?`,answer:`| Energieproduktion | Mitochondrien erzeugen ATP – das ist die Energie, die Muskeln bei Bewegung brauchen. |
| --- | --- |
| Stoffwechsel (Metabolismus) | Kohlenhydrate, Fette, Proteine werden abgebaut oder aufgebaut. |
| Regeneration & Wachstum | Muskelzellen reparieren beschädigte Fasern nach Training. |
| Signalverarbeitung | Nervenzellen leiten elektrische Signale zur Muskelsteuerung weiter. |
| Transport & Kommunikation | Zellen tauschen Stoffe und Informationen aus – wichtig z. B. für Hormonwirkungen (Testosteron, Insulin). |`},{id:`Sportbiologie-13`,topic:`Sportbiologie`,section:`Zellen`,question:`Welchen Eigenschaften haben Zellen?`,answer:`- folgen einer klaren Struktur und Ordnung
- reagieren auf Reize (z.B. Trainingsreiz)
- haben einen Stoffwechsel (Aufbau, Abbau und Umbau von Stoffen)
- können wachsen und sich vermehren → Zellteilung`},{id:`Sportbiologie-14`,topic:`Sportbiologie`,section:`Zellen`,question:`Nennen Sie die Bestandteile einer Zelle.`,answer:`- Zellmembran: äußere Schicht der Zelle, grenzt diese ab, besteht aus Fetten und Proteinen, halbdurchlässig → regelt was rein und raus darf
- Zellplasma: flüßige Substanz aus 75% Wasser, Nährstoffe etc → alle Organellen schwimmen hier drinnen
- Zellkern (Nukleos) → enthält DNA, zuständig für Proteinsynthese, Zellteilung
- Golgi Aparat → Verpackt und transportiert Proteine
- Ribosomen → bauen Proteine auf
- Endoplasmatisches Retikulum (ER) → Transportiert Stoffe
- Kernkörperchen Im Zellkern → baut Ribosomen
- Mitochondrien: Kraftwerke der Zelle → produzieren ATP (aerobe Energiebereitstellung)
- Lysosomen: Müllabfuhr → bauen Abfallstoffe ab
- Zentriolen → Proteinstruktur; wichtig bei der Zellteilung
[Abbildung im Wiki]`},{id:`Sportbiologie-15`,topic:`Sportbiologie`,section:`Zellen`,question:`Was für einen Einfluss hat Training auf Zellen?`,answer:`- Muskelzellen wachsen (Hypertrophie)
- Mitochondrien in Muskelzellen vermehren sich (bessere Ausdauer)
- Nervenzellen bilden neue Verbindungen (Koordination)
- Knochenzellen werden stabiler (durch Belastung)
- Herzmuskel wächst → mehr Ausdauer`},{id:`Sportbiologie-16`,topic:`Sportbiologie`,section:`Gewebe`,question:`Was ist Gewebe?`,answer:`- Gruppe gleichartiger Zellen, die zusammenarbeiten, um eine bestimmte Funktion im Körper zu erfüllen
- Zellen bilden Gewebe – Gewebe bilden Organe – Organe bilden dich`},{id:`Sportbiologie-17`,topic:`Sportbiologie`,section:`Gewebe`,question:`Welche Arten von Gewebe gibt es?`,answer:`- Epithelgewebe → überzieht innere u äußere Oberflächen des Körpers (zB Haut, Darmepithel, Flimmerepithel, ...)
- Muskelgewebe → Ermöglicht Bewegung
  - Arten: glatte M., quergestreifte M., Herzmuskulatur
- Nervengewebe → Verarbeitung von Reizen + Aufnahme & Weiterleitung (Gehirn, Rückenmark, Nerven)
- Binde und Stützgewebe
  - Fettgewebe → Energielieferant, Isolation Bsp: Speicherfett, Unterhautfett, Baufett
  - Knorpelgewebe – Faserknorpel → stoß- u zugfest; Bsp: Meniskus, Bandscheibe
  - Knorpelgewebe – Elastischer K. → biegsam & strukturgebend; Bsp: Ohrmurschel
  - Knorpelgewebe – Hyaliner K. → druckbeständig & fest; Bsp: Gelenksknorpel
  - Knochen → 12% des Körpergewichts; aus Ca2+, Wasser, anorganischen Mineralien (Phosphor, Magnesium, Eisen, Kalium, Natrium, ....) u organischen Knochenbälkchen (Trabekel)
  - Sehnen → Übertragung von Muskelkraft auf Knochen & Gelenke
  - Bänder → verbinden Knochen => Stabilität`},{id:`Sportbiologie-18`,topic:`Sportbiologie`,section:`Gewebe`,question:`Knorpelgewebe (Funktion, Ort, Eigenschaften, Einfluss von Belastung, Arten)`,answer:`- Funktion: Stoßdämpfer, Verringerung von Reibung
- Wo: Gelenke, Rippe, Nase, Ohr, Bandscheiben
- Eigenschaften:
  - Verliert an Elastizität mit Alter + geringe Regenerationsfähigkeit
  - Keine Blutgefäße → Ernähren sich durch Bewegung (Diffusion)
- Belastung
  - Kurzfristig: Flüssigkeitsaufnahme, Dickenzunahme
  - Langfristig: widerstandsfähiger, Hypertrophie, Erhöhung Stoffwechsel
  - Überlastung = Zerstörung = Arthrose
- Arten: Hyaliner, Faser, Elastischer Knorpel
- Knorpelschäden als Begleitverletzung bei Meniskus, Kreuzbänder => Ergussbildung
  - Microfrakturierung
  - Ostechondrale Transplantation (OATS)
  - „Knorpelkur“ (Synochrom®)`},{id:`Sportbiologie-19`,topic:`Sportbiologie`,section:`Gewebe`,question:`Sarkopenie (Definition, Folgen, Ursache, Therapie) → Muskelgewebe`,answer:`- Abbau von Muskelmasse und Kraft im hohen Alter → beginnend ab 30LJ → ab 50LJ = Abnahme um 0,8% pro Jahr → ab 60LJ = 3%/Jahr
- Folgen: weniger Muskelmasse, weniger Stabilität, Sturzgefahr, weniger Grundumsatz, Schwäche, Schmerzen
- Ursache: geänderter Stoffwechsel, Bewegungsmangel, Proteinmangel, Schlafmangel, Stress
- Therapie: Krafttraining + Ernährung (Protein, Omega 3, VitD3 & Calcium)`},{id:`Sportbiologie-20`,topic:`Sportbiologie`,section:`Gewebe`,question:`Adipositas → Fettgewebe`,answer:`- BMI > 30kg / m2 (außer bei trainierten Personen mit viel Muskelmasse)
- Ursache: falsche Ernährung, Bewegungsmangel
- Folgen: mehr Fettzellen → mehr Entzündungen → Insulinresistenz
- Therapie: Krafttraining (mehr Muskelmasse = erhöhter Grundumsatz = mehr Energieverbrauch) und Lebensstiländerung (Ernährung → Kaloriendefizit)`},{id:`Sportbiologie-21`,topic:`Sportbiologie`,section:`Gewebe`,question:`Diabetes mellitus`,answer:`- Zucker im Blut zu hoch → entweder weil Körper zu wenig Insulin produziert oder nicht mehr richtig darauf reagiert → Ausscheidung von Zucker im Urin
- Insulin → Mangel = Typ 1 (Autoimmunerkrankung) und Resistenz = Typ 2 (durch Adipositas z.B.)
- Folgen: Insulin = Hormon, dass Glukose in die Zellen bringt → wenn es fehlt können Zellen kein ATP mehr produzieren → Glukose bleibt im Blut und schädigt Gefäße, Nerven, Nieren
- Therapie: Medikamente, Krafttraining, Gewichtsverlust`},{id:`Sportbiologie-22`,topic:`Sportbiologie`,section:`Gewebe`,question:`arterielle Hypertonie`,answer:`- hoher Blutdruck (RR) > 140/90mmHg
- Ursachen: Bewegungsmangel, Ernährung, Stress, Genetik, zu viel Salz
- Folgen: Schlaganfall, Nierenversagen, Gefäßverkalkung, Herzinfarkt
- Therapie: Ausdauer und Krafttraining → ABER KEINE maximale Belastung oder Pressatmung`},{id:`Sportbiologie-23`,topic:`Sportbiologie`,section:`Knochen`,question:`Was sind Knochen?`,answer:`- sind das stabilste Gewebe im Körper
- kein totes Gewebe → ständiger Auf-/Abbau von Knochen (10% werden jährlich ersetzt)
- bilden mit Gelenken, Bändern und Muskeln den Bewegungsapparat
- Aufgaben der Knochen:
  - Hebelfunktion
  - Schutzfunktion
  - Stützfunktion
  - Ansatz für Muskeln und Sehnen
- Belastung formt Knochen → Regelmäßiger, dosierter Druck und Zug macht Knochen dichter und stärker.`},{id:`Sportbiologie-24`,topic:`Sportbiologie`,section:`Knochen`,question:`Aufbau von Knochen`,answer:`| Kompakta (Corticalis) | dichte, feste Außenschicht | trägt Druck- und Zugkräfte, sehr belastbar |
| --- | --- | --- |
| Spongiosa (Trabekelwerk) | schwammartige Innenschicht | federt Belastung ab, passt sich Belastungsrichtung an |
| Knochenmark | weiches Inneres, Blutbildung | Regeneration & Sauerstofftransport |
| Periost (Knochenhaut) | stark durchblutet, Schmerzempfindung | heilt Brüche, reagiert auf Zugspannung bei Training |

[Abbildung im Wiki]`},{id:`Sportbiologie-25`,topic:`Sportbiologie`,section:`Knochen`,question:`Arten von Knochen`,answer:`| Art | Beispiel | Funktion |
| --- | --- | --- |
| Röhrenknochen | Oberarm-, Oberschenkelknochen | Hebelwirkung, Bewegung |
| Platte Knochen | Schädel, Rippen, Schulterblatt | Schutz, große Ansatzflächen |
| Kurze Knochen | Handwurzel, Fußwurzel | Stabilität, Stoßdämpfung |
| Unregelmäßige Knochen | Wirbel | kombinierte Funktion |
| Sesambeine | Kniescheibe | Kraftumlenkung, Schutz von Sehnen |
| luftgefüllte Knochen | Stirnhöhle |  |`},{id:`Sportbiologie-26`,topic:`Sportbiologie`,section:`Knochen`,question:`Osteoporose`,answer:`- Abnahme der Knochendichte durch gesteigerten Knochenabbau → Spongiosa mehr betroffen als Kortikalis → erhöhte Frakturanfälligkeit (Knochenbrüche)
- Ursachen: Bewegungsmangel, Ernährung, Alter, Hormonmangel, Kalzium und VitD3 Mangel, geringe Muskelmasse
- Folgen: Knochenbrüche, Schmerzen, Rundrücken
- Therapie: Medikamente (VitD3, Calcium, Bisphosponate) + Training (große Muskelgruppen abwechselnd, Koordination, Zug / Druckbelastung)`},{id:`Sportbiologie-27`,topic:`Sportbiologie`,section:`Gelenke`,question:`Was ist ein Gelenk?`,answer:`- Bewegliche Verbindung zwischen zwei oder mehr Knochen → ermöglicht Bewegung in bestimmte Richtungen.
- Aufgaben: Bewegung, Kraftübertragung, Stoßdämpfung, Stabilität
- Lebt von Bewegung, aber leidet unter Fehlbelastung
- Echtes = Diarthrosen
- Unechtes = Synarthrosen → Knorpelige (Rippenknorpel) oder Bindegewebige (Nähte Schädelknochen) Knochenverbindung`},{id:`Sportbiologie-28`,topic:`Sportbiologie`,section:`Gelenke`,question:`Aufbau eines Gelenks`,answer:`- Gelenkkopf & Pfanne → Knochenenden
- Gelenkknorpel → glatte elastische Schicht → hyaliner Knorpel → vermindert Reibung & Druck
- Gelenkspalt → enthält Gelenkflüssigkeit
- Gelenkflüssigkeit → schmiert und ernährt den Knorpel
- Gelenkkapsel → umschließt Gelenk luftdicht & produziert Gelenkflüssigkeit
- Bänder (Ligamente) → verbinden Knochen
- Muskeln und Sehnen → dynamische Stabilisation und Bewegungsausführung
[Abbildung im Wiki]`},{id:`Sportbiologie-29`,topic:`Sportbiologie`,section:`Gelenke`,question:`Welche Arten von Gelenke?`,answer:`- Kugelgelenk: Schulter, Hüfte → 3 Freiheitsgrade (Extension, Flexion, Abduktion, Adduktion, Rotation)
- Scharniergelenk: Ellbogen, Knie → beugen und Strecken
- Eigelenk: Handgelenk → 2 Freiheitgrade
- Sattelgelenk: Daumenwurzel → 2 Freiheitsgrade (Flex/Ext, Abd/Add)
- Rad/Drehgelenk: Unterarm (Radius-Ulna) → Rotation
- Planes (Gleit-) Gelenk: Wirbelgelenke → kleine Gleitbewegung`},{id:`Sportbiologie-30`,topic:`Sportbiologie`,section:`Gelenke`,question:`Wirkung von Training auf Gelenke`,answer:`- Verbesserung in Knorpel, Bänder & Kapsel, Muskeln, Knochenenden
- Mehr Beweglichkeit, Stabilität, Belastung, Regeneration
- Bewegung = Schmierung`},{id:`Sportbiologie-31`,topic:`Sportbiologie`,section:`Gelenke`,question:`Häufige Probleme bei Gelenken`,answer:`- Arthrose → Überlastung, Fehlbelastung, Bewegungsmangel → Belastungsreduktion, Medikamente, Operation, Ernährung, Krafttraining mit guter Technik
- Bänderriss / Luxation → Trauma, Instabilität
- Gelenkentzündung (Arthritis) → Reizung, Übertraining
- Kapselreizung → wiederholte Mikrotraumen
Je mehr Freiheitsgrade, desto beweglicher – aber desto instabiler → z. B. Schulter = hohe Beweglichkeit, aber hohes Verletzungsrisiko.`},{id:`Sportbiologie-32`,topic:`Sportbiologie`,section:`Gelenke`,question:`Das Kniegelenk`,answer:`- Verbindet Oberschenkel mit Schienbein → Beuge, Streck und Drehbewegung
- Kniescheibe: Sesambein → besserer Hebel für Quadricepssehne
- Seitenbänder: inneres und äußeres → Stabil in Streckstellung
- Kreuzbänder: vorderes und hinteres → Stabilität
- Menisken: 2 halbmondäfrmige Faserknropel → Stoßdämpfer und Gelenkstabilisation

    - Plantarflexion (Fuß zu Fußsohle), Dorsalextension (Fuß zu Schienbein)
