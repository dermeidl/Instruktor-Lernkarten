- Weisungsgebundenheit → man muss machen, was einem gesagt wird
- fixe Arbeitszeit, vorgegebener Dienstort
- in Betriebsorganisation eingegliedert → zb Projektleiter
- regelmäßige Entlohnung → erfolgsunabhängig - Dienstnehmer „schuldet“ keinen Erfolg, nur Bemühen („Anwesenheit“)
- Dienstnehmer-Vollversicherungspflicht nach dem allgemeinen Sozialversicherungsgesetz (ASVG), zuständig österreichische Gesundheitskasse (ÖGK)
zusätzliche gesetzliche Bestimmungen:
  - Arbeitnehmerschutzgesetz
  - Arbeitszeitgesetz
Vorteile
  - Urlaubs- und Weihnachtsgeld (wenn im Kollektivvertrag vorgesehen)
  - 6 % Lohnsteuer für Urlaubs- und Weihnachtsgeld (steuerfrei bis Euro 620,00 pro Jahr)
  - Urlaubsentgelt (Lohn/Gehalt läuft während des Urlaubs weiter)
  - Entgeltfortzahlung im Krankenstand
  - Mitarbeitervorsorge
  - Arbeitslosengeld bei Kündigung`},{id:`Betriebskunde Peter 🤓-2`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`2. Nennen Sie die wesentlichen Merkmale einer geringfügigen Beschäftigung, wie hoch ist die Geringfügigkeitsgrenze 2025`,answer:`- Einkommen mit Geringfügigkeitsgrenze pro Monat in Höhe von Euro 551,10 (2025) begrenzt.
- nur Unfallversicherung → Kranken- und Pensionsversicherung müssen freiwillig selbst abgeschlossen werden (falls gewünscht) – sie sind nicht automatisch versichert`},{id:`Betriebskunde Peter 🤓-3`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`Mitarbeitervorsorge → also Pension?`,answer:`- Entgeltfortzahlung im Krankenstand
- Urlaubs- Weihnachtsgeld und Urlaubsentgelt freiwillig bzw. nur wenn im Kollektivvertrag vorgesehen
- kein Anspruch auf Arbeitslosengeld`},{id:`Betriebskunde Peter 🤓-4`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`3. Nennen Sie die Merkmale einer Tätigkeit als neuer Selbständiger`,answer:`- selbständige Tätigkeit, die keine gewerbliche Tätigkeit darstellt (nicht in der Gewerbeordnung geregelt) → Künstler, Schriftsteller
- Vorliegen eines Werkvertrags
- keine Mitgliedschaft bei der Wirtschaftskammer
- Neue Selbständige hat sich um seine Sozialversicherung selbst zu kümmern (Meldepflicht bei Überschreitung der Versicherungsgrenze)
- Bei Überschreitung der Versicherungsgrenze von Euro 6.631,20 (2025) → Vollversicherung nach dem gewerblichen Sozialversicherungsgesetz
(GSVG)
- Einkommen aus selbständiger Tätigkeit → Einkommensteuer
- Umsatzsteuerpflicht bei Regelbesteuerung
- Meldung beim FA innerhalb eines Monats ab Beginn`},{id:`Betriebskunde Peter 🤓-5`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`4. Was ist bei einer nebenberuflichen selbständigen oder gewerblichen Tätigkeit zu beachten`,answer:`Der Arbeitgeber muss über die angestrebte Selbstständigkeit informiert werden und auch seine Zustimmung geben - sonst Entlassungsgrund!
- Mehrfach versichert in Kranken- und Pensionsversicherung
- Wahlrecht bei Sozialversicherungsträger → wer muss Leistung übernehmen
- Unfallversicherung in der Höhe von 144,84€ fällt immer an
- Gemeinsame Höchstbeitragsgrundlage für alle Einkommen (ausgenommen Beamte) von Euro 90.300,00 (2025) → Sozialversicherung
- Ausnahme von der Vollversicherungspflicht in der gewerblichen Sozialversicherung möglich (Kleingewerbetreibende)
- Alle Einkünfte werden addiert und davon wird die Einkommenssteuer ermittelt → keine Grenze nach oben
- Einkommen aus selbstständiger Tätigkeit bzw. aus Gewerbebetrieb wird mit dem Grenzsteuersatz versteuert.`},{id:`Betriebskunde Peter 🤓-6`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`5. Was unterliegt der Umsatzsteuer`,answer:`- Lieferungen und sonstige Leistungen (Dienstleistungen) die ein Unternehmer im Inland gegen Entgelt im Rahmen seines Unternehmens ausführt
- der Eigenverbrauch ("Verkauf an sich selbst")
- Einfuhr aus einem Drittland
- Innergemeinschaftlicher Erwerb (Einfuhr aus einem Mitgliedsland der EU)
Unternehmer im Sinne des UStG ist, wer eine gewerbliche oder berufliche Tätigkeit selbständig ausübt. Gewerblich oder beruflich ist jede nachhaltige Tätigkeit zur Erzielung von Einnahmen.
Das Umsatzsteuergesetz ist grundsätzlich relevant für:
- freie Dienstnehmer
- neue Selbständige
- Gewerbetreibende
- Vereine bei erwerbswirtschaftlicher Tätigkeit`},{id:`Betriebskunde Peter 🤓-7`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`6. Beschreiben Sie den Vorsteuerabzug`,answer:`Vorsteuer = bezahlte Umsatzsteuer an Vorlieferanten
Bei Regelbesteuerung bekommt ein Unternehmer die Umsatzsteuer, die er an seinen Lieferanten für Vorleistungen (Waren, Verbrauchsmaterial, Hilfs- und Betriebsstoffe, Dienstleistungen, …) bezahlt hat, als Vorsteuer vom Finanzamt wieder zurück.
PKWs und Kombis sind vom Vorsteuerabzug ausgenommen. Ausnahme (Vorsteuerabzug zulässig bei):
- PKW und Kombi mit 0 Gramm CO2-Ausstoß (bis Anschaffungskosten bis zu Euro 80.000,00)
- Krafträder und Elektrofahrräder mit 0 Gramm CO2-Ausstoß`},{id:`Betriebskunde Peter 🤓-8`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`7. Bis wann (Datum) und unter welchen Voraussetzungen bzw. ab welchen Umsatz (Betrag) ist eine Umsatzsteuererklärung abzugeben`,answer:`Eine Umsatzsteuererklärung – Formular U1 ist über FinanzOnline bis 30.6. des Folgejahres einzureichen, wenn der Jahresumsatz Euro 55.000,00 (ab 2025) übersteigt bzw. bei Regelbesteuerung als Kleinunternehmer.`},{id:`Betriebskunde Peter 🤓-9`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`8. Wozu dient die Umsatzsteueridentifikationsnummer`,answer:`Die UID-Nummer dient dazu, Unternehmen im EU-weiten Waren- und Dienstleistungsverkehr eindeutig zu identifizieren und steuerfreie innergemeinschaftliche Lieferungen sowie die Anwendung des Reverse-Charge-Verfahrens zu ermöglichen. Die Umsatzsteueridentifikationsnummer (UID-Nummer) dient als Nachweis der Unternehmereigenschaft innerhalb der EU. Sie wird im Normalfall anlässlich der Meldung an das Finanzamt über die Aufnahme der gewerblichen/selbständigen Tätigkeiten durch die Finanzbehörde vergeben.`},{id:`Betriebskunde Peter 🤓-10`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`9. Beschreiben Sie das Prinzip der Umsatzsteuer anhand eines selbstgewählten Beispiels (Erbringung einer Dienstleistung und/oder Einkauf), gehen Sie auch auf die zu beachtenden Fristen ein`,answer:`- Umsatzsteuervoranmeldung (FinanzOnline) ist immer monatlich/quartalsweise zu erstellen
- Steuerschuld entsteht mit Ende des Monats der Zahlung = Voranmeldezeitraum
- Gegenüberstellung von Umsatzsteuer und (selbst bezahlter) Vorsteuer
- Umsatzsteuerschuld entsteht mit Ablauf des Monats der Zahlung (IST-Besteuerung) durch den Kunden
- Umsatzsteuer minus Vorsteuer = Zahllast oder Guthaben
- Fällig 45 Tage nach Ende des Voranmeldezeitraumes (Monat oder Quartal)
1. Beispiel Dienstleistung
  - Eigene Rechnung = Ausgangsrechnung
  - Enthält im Normalfall Umsatzsteuer (USt)
Honorar für Personal Fitnesstraining 10 Std. á Euro 50,00 (kein Kleinunternehmer) → Rechnungsdatum 30.08.2025
Personal Fitnesstraining 10 Std. á Euro 50,00 Euro 500,00 + 20 % USt Euro 100,00 Rechnungsbetrag Euro 600,00
Der Kunde bezahlt am 10.09.2025 den Rechnungsbetrag von Euro 600,00. Der Trainer muss die erhaltene Umsatzsteuer (Mehrwertsteuer) von Euro 100,00 an das Finanzamt abführen. Die Steuerschuld entsteht mit Ende September 2025, Voranmeldezeitraum daher September 2025. Die Umsatzsteuer ist 45 Tage nach Ende des Voranmeldezeitraumes, somit am 15. November 2025 zu entrichten.
1. Beispiel Einkauf
  - Fremde Rechnung = Eingangsrechnung
  - Enthält im Normalfall Umsatzsteuer (= Vorsteuer VSt)
Personal Fitnesstrainer kauft am 20.09.2025 Nordic Walking Stöcke um Euro 105,00 + 20 % USt
Nordic Walking Stöcke Euro 105,00 + 20 % USt Euro 21,00 Rechnungsbetrag Euro 126,00 Der Fitnesstrainer bezahlt am 20.09.2025 126,00 Euro und holt sich die Umsatzsteuer, die er an den Lieferanten bezahlt hat (= Vorsteuer) vom Finanzamt zurück. Das Vorsteuerguthaben entsteht mit Ende September 2025, Voranmeldezeitraum daher September 2025. Die Vorsteuer kann 45 Tage nach Ende des Voranmeldezeitraumes, somit ebenfalls am 15. November geltend gemacht werden.
1. Beispiel Zusammenfassung
Umsatzsteuervoranmeldung September 2025, Formular U30 Zahllast 09/2025 Umsatzsteuer Euro 100,00 minus Vorsteuer Euro 21,00 Euro 79,00 Fälligkeit: Voranmeldezeitraum = September + 45 Tage = 15.11.2025`},{id:`Betriebskunde Peter 🤓-11`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`10. Beschreiben Sie die Kleinunternehmerregelung im Sinne des § 6 (1) Ziffer 27 Umsatzsteuergesetzes`,answer:`Kleinunternehmen mit einem Jahresumsatz von Euro 55.000,00 sind von der Umsatzsteuer unecht befreit, d.h. sie dürfen keine Umsatzsteuer in Rechnung stellen, können sich aber auch keine Vorsteuer abziehen. Sie erhalten auch keine Umsatzsteuer-Identifikationsnummer (Behandlung durch das Finanzamt analog Privatpersonen).
Die Kleinunternehmerregelung ist möglich bei Tätigkeit als
- Freier Dienstnehmer
- Neuer Selbständiger
- Gewerbetreibender
- Verein (erwerbswirtschaftlicher Bereich)
Einstufung durch das Finanzamt bei Meldung über Aufnahme der selbständigen/ gewerblichen Tätigkeit (Formular VERF 24 bzw. FinanzOnline).
Einkünfte aus nichtselbständiger Tätigkeit (Dienstverhältnis) und Hilfsgeschäfte (z.B. Verkauf von Anlagegütern) werden in diese Grenze nicht einbezogen. Einmal in fünf Jahren kann die Umsatzgrenze von Euro 55.000,00 um maximal 10 % überschritten werden.
Wichtig: Hinweis auf der Ausgangsrechnung „Kleinunternehmer, im Rechnungsbetrag ist keine Umsatzsteuer enthalten“ ist unbedingt erforderlich!
Auch bei Unterschreitung dieser Umsatzgrenze kann mit Umsatzsteuer gearbeitet werden. Dazu muss allerdings ein „Antrag auf Regelbesteuerung“ - Formular U 12 gestellt werden (gilt für die folgenden 5 Jahre).`},{id:`Betriebskunde Peter 🤓-12`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`11. Wann ist die Kleinunternehmerregelung sinnvoll`,answer:`- bei nebenberuflicher selbständiger/gewerblicher Tätigkeit
- wenn keine Gefahr besteht, die Umsatzgrenze zu überschreiten
- bei geringen Investitionen und Vorleistungen
- wenn die Kunden Privatpersonen sind`},{id:`Betriebskunde Peter 🤓-13`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`12. Was regelt das Einkommensteuergesetz, führen Sie mindestens 4 Einkunftsarten an`,answer:`Das Einkommensteuergesetz regelt die Besteuerung des Einkommens natürlicher Personen und kennt 7 Einkunftsarten:
  1. Einkommen aus Land- und Forstwirtschaft § 21 EStG
  1. Einkommen aus selbständiger Arbeit § 22 EStG
  1. Einkommen aus Gewerbebetrieb § 23 EStG
  1. Einkommen aus nichtselbständiger Arbeit § 25 EStG
  1. Einkommen aus Kapitalvermögen § 27 EStG
  1. Einkommen aus Vermietung und Verpachtung § 28 EStG
  1. sonstige Einkünfte § 29 EStG
Einkommen aus nichtselbständiger Tätigkeit unterliegt der Lohnsteuer = eigene Erhebungsform der Einkommensteuer für Arbeitnehmer.
Die Einkommensteuer ist die „Lohnsteuer“ der Selbständigen und betrifft
- freie Dienstnehmer
- neue Selbständige
- Gewerbetreibende
Freie Dienstnehmer und neue Selbständige haben Einkommen aus selbständiger Tätigkeit, Gewerbetreibende aus Gewerbebetrieb.
Vereinsfunktionäre und andere für einen Verein tätige Personen müssen ihre Aufwandsentschädigungen in der Einkommensteuererklärung als Einkommen aus sonstiger selbständiger Tätigkeit erfassen, wenn die Spesenpauschale von Euro 75,00 pro Monat pro Verein überschritten wird.
Basis und Bemessungsgrundlage für die Einkommensteuer ist der jährlich erwirtschaftete Gewinn, üblicherweise ermittelt mit Hilfe der Einnahmen-Ausgaben-Rechnung, die bis zu einem Umsatz von Euro 700.000,00 pro Jahr zulässig ist (Vereine bis Euro 1,0 Mio Einnahmen oder Ausgaben).`},{id:`Betriebskunde Peter 🤓-14`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`13. Nennen Sie die Kategorien von Betriebseinnahmen, führen Sie zu jeder Kategorie mindestens ein Beispiel an`,answer:`- Erlöse aus Lieferungen und Leistungen → Die vom Kunden bezahlten Rechnungen für Waren und Dienstleistungen
  - Bei einem Verein z. B. Mitgliedsbeiträge, Spenden und Subventionen, …
- Erlöse aus dem Verkauf von Anlagevermögen → Erlös aus dem Verkauf von Gegenständen des Anlagevermögens (Maschinen, Computer, … ). Ergebniswirksam ist hier der Unterschiedsbetrag zwischen Verkaufserlös und dem Restbuchwert → Verkauf von gebrauchten Firmenauto
- Erlöse aus Eigenverbrauch → Die Entnahme von Waren für den eigenen Verbrauch („Verkauf an sich selbst“) zählen ebenso zu den Betriebseinnahmen wie die Privatnutzung des Firmenvermögens (Fahrzeug)
Anmerkung Privateinlagen/ Bargeld zur Finanzierung von betrieblich veranlassten Ausgaben sind KEINE Einnahmen, sondern verändern lediglich das Bankkonto`},{id:`Betriebskunde Peter 🤓-15`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`14. Wie sind Betriebsausgaben definiert, nennen Sie mindestens fünf Beispiele`,answer:`Darunter fallen alle Ausgaben, die zur Leistungserbringung notwendig sind, vorausgesetzt sie werden entsprechend dokumentiert und belegt.
Typische Betriebsausgaben sind:
- Abschreibungen auf das Anlagevermögen
- Aus- u. Fortbildung
- Büromaterial
- Fachliteratur
- Fahrtspesen
- Haftpflichtversicherung, Sachversicherung
- Kfz-Kosten/Kfz-Leasing
- Löhne, Gehälter inklusive Nebenkosten
- Miet- u. Pachtaufwand
- Mitgliedsbeiträge/ Verbandsbeiträge
- Postgebühren
- Rechts- u. Beratungskosten (Steuerberater)
- Sozialversicherungsbeiträge
- Tag- u. Nachtgelder (=Diäten)
- Telefonkosten, Fax, Internet
- Waren, Roh-, Hilfs - u. Betriebsstoffe
- Werbung
- Zinsaufwand für Bankkredite`},{id:`Betriebskunde Peter 🤓-16`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`15. Erklären Sie den Begriff Abschreibung auf das Anlagevermögen, ab welcher Höhe der Anschaffungskosten (aktueller Wert) ist eine Abschreibung vorzunehmen`,answer:`Abschreibung auf das Anlagevermögen betrifft Wirtschaftsgüter des Anlagevermögens, die dazu bestimmt sind, dem Betrieb längerfristig (> 3 Jahre) zu dienen und deren Anschaffungskosten 1.000€ überschreiten (netto ohne Umsatzsteuer bei Regelbesteuerung, inkl. Umsatzsteuer bei Kleinunternehmer).
Die Anschaffungskosten sind auf die betriebsgewöhnliche Nutzungsdauer zu verteilen.
Der so ermittelte Betrag ist als Abschreibung in der Einnahmen-Ausgaben-Rechnung als Betriebsausgabe zu erfassen.
Bei Anschaffungen nach dem 30. Juni kann im Anschaffungsjahr nur mehr eine Halbjahresabschreibung geltend gemacht werden.
Investitionen sind in einem Anlageverzeichnis zu erfassen.`},{id:`Betriebskunde Peter 🤓-17`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`16. Wie sind geringwertige Wirtschaftsgüter definiert, wie hoch ist die Geringwertigkeitsgrenze (aktueller Wert)`,answer:`Betrifft Wirtschaftsgüter, die dazu bestimmt sind, dem Betrieb längerfristig zu dienen und deren Anschaffungskosten Euro 1.000,00 nicht überschreiten (netto ohne Umsatzsteuer bei Regelbesteuerung, inklusive Umsatzsteuer bei Kleinunternehmer). Die Anschaffungskosten können im Jahr der Anschaffung als Betriebsausgabe abgesetzt werden.`},{id:`Betriebskunde Peter 🤓-18`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`17. Stellen Sie das vereinfachte Schema der E-A-Rechnung dar`,answer:`[Abbildung im Wiki]`},{id:`Betriebskunde Peter 🤓-19`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`18. Bis wann (Datum) und ab welcher Einkommenshöhe (Betrag) ist eine Einkommensteuererklärung abzugeben`,answer:`Eine Einkommensteuererklärung ist abzugeben, wenn die Gesamteinkünfte im Jahr 2025 mehr als Euro 13.308,00 bzw. mehr als Euro 14.517,00 betragen und lohnsteuerpflichtige Einkünfte enthalten sind oder wenn man vom Finanzamt dazu aufgefordert wird. Als Aufforderung gilt auch die Zuteilung einer Steuernummer mit dem "Signal E".
Über FinanzOnline ist die Einkommensteuererklärung für das Kalenderjahr – Formular E1 inkl. der Beilage E1a (= E/A Rechnung) bis 30. Juni des Folgejahres beim zuständigen Finanzamt einzureichen. Auf Antrag ist eine Fristverlängerung möglich.`},{id:`Betriebskunde Peter 🤓-20`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`19. Erklären Sie den Grundfreibetrag`,answer:`Der Grundfreibetrag für Gewinne bis Euro 33.000,00 in der maximalen Höhe von Euro 4.950,00,00 (15 % von Euro 33.000,00 bzw. darunter 15 % vom Gewinn) ist eine reine Steuerentlastung, er reduziert IMMER die Einkommensteuerbemessungsgrundlage. Maximale Steuerersparnis 55 % von Euro 4.950,00 = 2.722,50 für Gewinne größer Euro 1.004.950,00 Der Grundfreibetrag wird vom Finanzamt bei der Einkommensteuerermittlung automatisch berücksichtigt.`},{id:`Betriebskunde Peter 🤓-21`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`20. Ihr Einkommen beträgt Euro 29.000,00. Ermitteln Sie die Einkommensteuer mit Hilfe folgender Formel: (Einkommen – 21.617) ÷ 14.219 x 4.265,70 + 1.661,80, berücksichtigen Sie den Grundfreibetrag von 15 %.`,answer:`Man muss sich nur merken, dass Gewinnfreibetrag 33.000€ und in Formel einsetzen.
29.000€ - 4.350 (15% von 29.000) = 24.650€ → in Formel einsetzen → (24.650€ - 21.617) / 14.219 x 4.265,70 + 1.661,80 = 2.571,7€`},{id:`Betriebskunde Peter 🤓-22`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`21. Ihr Einkommen beträgt Euro 43.000,00. Ermitteln Sie die Einkommensteuer mit Hilfe Formel: (Einkommen – 35.836) ÷ 33.330 x 13.332,00 + 4.265,70 + 1.661,80, berücksichtigen Sie den Grundfreibetrag von 15 %.`,answer:`Man muss sich nur merken, dass Gewinnfreibetrag 33.000€ und in Formel einsetzen.
43.000€ - 4.950 (15% von Maximaler Freibetrag 33.000) = 38.050€ → in Formel einsetzen → (38.050 - 21.617) / 14.219 x 4.265,70 + 1.661,80 = 6.591,7€`},{id:`Betriebskunde Peter 🤓-23`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`22. Was ist im Einkommensteuerrecht beim Zusammentreffen mehrerer Einkünfte zu beachten`,answer:`Wird neben einem Dienstverhältnis auch eine gewerbliche/selbständige Tätigkeit ausgeübt, ist ab dem Jahr, in dem mit der Tätigkeit begonnen wurde, eine Einkommensteuererklärung, die die Arbeitnehmerveranlagung ersetzt, abzugeben.
Einkommen aus selbständiger Tätigkeit ist mit E-A-Rechnung zu ermitteln
Es liegen meist zwei Einkunftsarten vor: Einkommen aus Gewerbebetrieb bzw. aus selbständiger Tätigkeit und Einkommen aus unselbständiger Tätigkeit.`},{id:`Betriebskunde Peter 🤓-24`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`Alle Einkünfte werden zusammenaddiert und davon die Einkommensteuer ermittelt. Mit den Einkünften z. B. aus unselbständiger Tätigkeit befindet man sich in einer bestimmten Progressionsstufe. Jeder zusätzlich verdiente Euro wird mindestens mit diesem Steuersatz (= Grenzsteuersatz) besteuert. → auch die Einkünfte vom Angestelltenverhältnis?`,answer:`Ausnahme: Liegen die Einkünfte z. B. aus Gewerbebetrieb unter dem Dienstnehmer-Veranlagungsfreibetrag von Euro 730,00 werden diese Einkünfte NICHT versteuert!`},{id:`Betriebskunde Peter 🤓-25`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`23. Ihre Lohnsteuerbemessungsgrundlage beträgt Euro 25.000,00. Als Trainer haben Sie einen Gewinn von Euro 3.000,00 erzielt. Wie hoch ist die Einkommensteuerbemessungsgrundlage, die Einkommensteuer und das Nettoeinkommen für den Gewinn aus der Trainertätigkeit. Berücksichtigen Sie den Grundfreibetrag von 15 %, der Steuersatz (Grenzsteuersatz) für die Tarifstufe 3 von 21.617 bis 35.836 beträgt 30 %`,answer:`- Einkommenssteuerbemessungsgrundlage:
  - Einkommen – Grundfreibetrag = 3000 x 0,85 = 2.550€
- Einkommenssteuer:
  - 30% von Est. Bemessungsgrundlage = 2.550 x 0,3 = 765€
- Nettoeinkommen:
  - Einkommen – Est = 3.000 – 765 = 2.235€`},{id:`Betriebskunde Peter 🤓-26`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`24. Was bezeichnet man als Höchstbeitragsgrundlage zur Sozialversicherung, wie hoch ist sie (Betrag 2025)`,answer:`Beitragsgrundlage = Basis für die Berechnung der Sozialversicherungsbeiträge!
Als Höchstbeitragsgrundlage bezeichnet man den maximalen Betrag, den man an Sozialversicherung bezahlen muss. → begrenzt Sozialversicherungsbeiträge nach oben → 90.300€
Einkommen darüber unterliegen nicht mehr der Sozialversicherung, wobei alle Einkommen (ausgenommen Beamte) zusammengerechnet werden.
Keine SV Beiträge für Einkommen über 90.300€`},{id:`Betriebskunde Peter 🤓-27`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`25. Was bezeichnet man als Mindestbeitragsgrundlage zur Sozialversicherung. Wie hoch ist sie (Betrag 2025)`,answer:`Als Mindestbeitragsgrundlage bezeichnet man den Betrag (Gewinn), ab dem man Sozialversicherung bezahlen muss. → begrenzt Sozialversicherungsbeiträge nach unten → 6.613,20€
Vorläufiger Mindestbeitrag gesamt Euro 1.919,16 (2025)
Setzt sich aus Pensionsversicherung, Krankenversicherung und Sozialversicherungsanstalt der Selbstständigen zusammen hinzu kommt die Unfallversicherung welche nicht prozentuell sondern mit 144,84€ verrechnet wird.
PV= 18,50% der Beitragsgrundlage
KV= 6,80% der Beitragsgrundlage
SVS= 1,53%
UV= 144,84€`},{id:`Betriebskunde Peter 🤓-28`,topic:`Betriebskunde Peter 🤓`,section:`Allgemein`,question:`26. Beschreiben Sie die Ausnahme von der Vollversicherungspflicht (Kleinunternehmerregelung im Sinne der Sozialversicherung), wie hoch sind die Versicherungsgrenzen für Umsatz und Gewinn 2025`,answer:`Für Kleingewerbetreibende besteht die Möglichkeit, sich auf Antrag bei der Sozialversicherungsanstalt der gewerblichen Wirtschaft (SVS) von der Pflichtversicherung zur Kranken- und Pensionsversicherung befreien zu lassen.
Dies macht natürlich nur Sinn, wenn anderweitig eine Sozialversicherung z. B. aus einem Dienstverhältnis oder als mitversicherter Ehegatte gegeben ist.
Wesentliche Voraussetzungen dafür sind:
- innerhalb der letzten 60 Monate nicht mehr als 12 Monate Pflichtversicherung nach dem GSVG
- jährlicher Umsatz nicht mehr als Euro 55.000,00
- jährliche Einkünfte nicht mehr als Euro 6.613,20 (2025)
Gewinn laut E-A-Rechnung maximal Euro 7.780,24 (ab Veranlagung 2025) Abzug von 15 % Grundfreibetrag = Einkommensteuer BGL = 6.613,20 (2025).
Diese Grenzen beziehen sich ausschließlich auf eine gewerbliche Tätigkeit! Wird eine der beiden Grenzen überschritten, ist die SVS innerhalb eines Monats zu informieren`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-1`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Welche Eigenschaften machen einen guten Trainer aus?`,answer:`Schüler im Mittelpunkt
Motive und Ziele`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-2`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Sportpädagogik: Lehre von der Erziehung im Sportunterricht Was, Warum und Wozu? (Sinn, Ziele, Begründung)`,answer:`Begründungs

Entwickelnd (induktiv) → selbstständiges Üben z.B. Aufwärmen

- heute (ab. 19 Jhd.): Es zählen Leistungen, Ergebnisse, ständige Verbesserung, Vergleiche, Zeiten, Rekorde
  - Volkamer 1987: willkürliche Schaffung von Aufgaben/Problemen/Konflikte, mit körperlichen Mitteln lösbar, wiederholbar, verbesserbar, übbar, Handlung ohne unmittelbare materielle Veränderung`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-15`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was versteht man unter Sportpädagogik?`,answer:`- Die Lehre von der Erziehung im Sportunterricht
- Fragt nach WOZU? (Sinn/Ziele) und WARUM? (Begründung)
- Teilgebiet der Sportwissenschaft seit 1970 → untersucht Zusammenhang von Bildung und Erziehung
  - Sport: Bestandteil der Bewegungskultur
  - Erziehung: Einwirkung auf Menschen mit dem Ziel zur Selbstbestimmung
  - Bildung: Selbstgestaltung des Menschen im Prozess der Auseinandersetzung mit den Inhalten und Werten der Bewegungskultur
- Philosophische Grundlagen: Das anthropologische Verständnis, die ethischen Normen und die ästhetische Wahrnehmung der Bewegung und des Körpers sind historisch und kulturell geprägt.
- Ziel: Menschen durch Bewegung zu vernünftiger Selbstbestimmung und ästhetischer Selbsterfahrung befähigen.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-16`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind die Funktionen der Sportpädagogik?`,answer:`- Ist eine
  - Begründungs-: Philosophie
  - Orientierungs-: Allgemeine Pädagogik
  - Tatsachen-: Sportwissenschaften
  - Beratungswissenschaft: Sportdidaktik
- Hinterfragt Sinn, Begründung und Verantwortung des Handelns bezüglich Körper und Bewegung und bezieht dabei Bildung und Historie mit ein
[Abbildung im Wiki]`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-17`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Warum ist die Sportpädagogik für TrainerInnen relevant?`,answer:`- Als Trainer brauch man pädagogisches Geschick und die Bereitschaft Erzieher zu sein → Menschen für Bewegung begeistern
- Kinder und Erwachsene werden immer unsportlicher, unbeweglicher und dicker
- Menschen bewegen sich immer weniger → dies führt zu erhöhte Kosten für Staat und Person, mehr verpasste Schultage / Arbeitstage (Fehlzeiten), schlechtere Noten, mehr Tode, geringeres Einkommen, weniger Lebenszeit, Krankheiten: Diabetes, Herz-Kreislauferkrankungen
- Mehr Bewegung bedeutet: weniger Gesundheitsrisiko, weniger Kosten, mehr Verdienst, bessere Produktivität
- Bewegung macht alles besser!`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-18`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind die Kompetenzen von TrainerInnen?`,answer:`[Abbildung im Wiki]
- Selbstkompetenz
  - Selbstmanagement
  - Persönlichkeitsentwicklung
  - Funktionsverständnis
- Sozialkompetenz
  - Glaubwürdige Persönlichkeit
  - Charismatische Bezugsperson
  - Empathie
  - Ehrlichkeit
  - Kommunikation
  - Teamwork
  - Respekt
  - Wertschätzung
- Sachkompetenz
  - Eigenkönnen
  - Zielverständnis
  - Lernverständnis
  - Organisationskompetenz
- Kommunikation → Es zählt nicht die Information die man gibt, sondern die die ankommt
  - Information (Was), Mitteilung (Wie), Verstehen
  - Ambiente schaffen
  - Teamwork
- Konfliktlösungen
  - Ursachen finden (zu wenig Anerkennung, Kommunikationsprobleme)
  - Lösungen (gemeinsam) aushandeln
  - Kompromissbereitschaft
  - Keine Sieger-Verlierer-Denken
  - Trainer und Athlet auf einer Ebene → keine Hierarchie
  - Wichtig ist nicht WIE Informationen weitergegeben werden, sondern WAS ankommt
[Abbildung im Wiki]
[Abbildung im Wiki]`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-19`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Persönlichkeit eines Trainers`,answer:`- Trainingstechnisches Know-How
- Pädagogische Fähigkeiten
- Menschliche Fähigkeiten
  - Höflich / Freundlich
  - Charisma
  - Zuhören
  - Körpersprache
  - Lob
  - Bescheidenheit
  - Respekt
  - Vertrauen aufbauen
- Selbstreflexion
  - Überzeugungskraft
  - Wissen
  - Erfahrung
  - Kritikfähigkeit
  - Kommunikationfähigkeit`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-20`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Geschichte Sportpädagogik (Neuzeitliche Problemgeschichte)`,answer:`- Jean Jaques Rosseau (1712 - 1778)
  - Aufwertung des Körpers + Pädagogischer Umgang durch Sport
  - Negative Pädagogik und Methode inactive
  - Allgemeine pädagogische Grundsätze
    - Anerkennung der Kindheit als Lebensphase → es geht ums Menschsein
    - Erziehung dient dem Zweck, die natürliche Bestimmung des Kindes zu entfalten
    - Gewähren lassen → Die Situation lehrt, nicht der Erzieher (methode inactive)
  - Bewegungspädagogische Grundsätze
    - Leiblichkeit und Bewegung sind im Spannungsfeld mit Natur und Gesellschaft
    - Optimistisches Menschenbild
    - Freie Bewegungsleben
- Philanthropistische Gymnastik / Deutsches Turnen (1770 - 1890)
  - Institutionalisierung der Leibeserziehung (Schule)
  - Perfektionierung des Menschen an Geist, Moral und Körper durch Erziehung
  - Körper ist Werkzeug des Geistes
[Abbildung im Wiki]
  - Disziplinierung, Werteerziehung
  - Geist=Herrscher, Körper= Maschine des Geistes
  - Turnen= freiheitliche Widerstandsbewegung
  - Politisierung des Körpers
- Reformpädagogische Leibeserziehung (1890 - 1933)
  - Reform des Schulwesens → Erziehung vom Kind (Leibe) aus
  - Einheit von Leib und Seele
  - Natürlichkeit und Rhytmus
  - Gymnastik (funktionell) → natürliches Turnen (keine Vorschriften → Exploration, Fehler sind notwendig, in der Natur steckt die Weisheit) → Sport
- NS Leibeserziehung (1933-1945)
  - Huldigung des Leibes und Missbrauch der Bewegung
  - Gehorsam / Kollektivierung
  - Leistungsfähigkeit
- Körpererziehung, Theories der Leibeserziehung, Sportcurriculum, Didaktische Strömungen (1949 - 1990)
  - Der Leib als Bildungsmedium und gesellschaftliches Tatsache des Sports
[Abbildung im Wiki]`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-21`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Unterschied Sportunterricht vs. Bewegungsunterricht`,answer:`- Sportunterricht: orientiert an Sportarten, Techniklernen, Normen, Nachahmung → orientiert sich an aktueller Sportwelt, Normen und Idealbilder im Vordergrund, Erlernen vorgegebener Fertigkeiten, Schule als Lehranstalt, Lehrer als Lehrmeister
  - Ziele: Leistung reflektieren, Miteinander handeln, Wahrnehmung verbessern, Dinge wagen und verantworten, Gesundheit bewusst machen und verbessern, Motivation für Bewegung schaffen
- Bewegungsunterricht: orientiert an individueller Entwicklungsförderung, kreative Gestaltung, entdeckendes Lernen → ist individueller, Entwicklungsförderung, Bewegungsaufgaben lösen; Lernen durch erkunden, entdecken und erfahren. Schule als Lernwerkstatt, Lehrer als Coach`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-22`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Sinn-Perspektiven vom Sportunterricht`,answer:`- Leistung: Das Leisten erfahren und reflektieren
- Miteinander: Gemeinsam handeln, spielen und sich verständigen
- Eindruck: Die Wahrnehmungsfähigkeit verbessern, Bewegungserfahrungen erweitern
- Ausdruck: Sich körperlich ausdrücken, Bewegungen gestalten
- Wagnis: Etwas wagen und verantworten
- Gesundheit: Die Fitness verbessern, Gesundheitsbewusstsein entwickeln`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-23`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Lehre vom Lernen und Lehren im Sportunterricht → Wie kann Sport sinnvoll, zielgerichtet und wirksam vermittelt werden?`,answer:`- Fragt nach WAS? (Inhalte) → z.B. Kraulen wird beim Schwimmtraining vermittelt
- Inhalte des Sportunterrichts: Sportarten, Bewegungsfelder, Kompetenzen, pädagogische Perspektiven.
- Sportdidaktik beschäftigt sich mit den Inhalten, Zielen, Methoden und Organisationsformen des Sportunterrichts oder sportlichen Trainings`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-24`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was versteht man unter Sportmethodik?`,answer:`- Lehre von Unterrichtsverfahren im Sport → die Lehre von der Lehre (wie wendet man konkrete Methoden an)
- Fragt nach WIE? (Vermittlung) → z.B. wie vermittle ich Kraulen beim Schwimmtraining am Besten
- Methoden sind planmäßige und überlegte Verfahren um mit einfachen Mitteln möglichst schnell und sicher zum Erfolg zu kommen
- Methoden lehren und anwenden → Selbstentwicklung zulassen
- Im Sport: Der Weg den der Trainer bestimmt um Zielführend, schnell und lustig lehren
- Grundsätze, Lehrmethoden, Hilfsmittel, Reihen, Lehr/Lernvorgang`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-25`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind die Grundsätze der Methodik?`,answer:`- Von leicht zu schwer
- Von einfach zu komplex
- Von bekannt zu unbekannt
- Altersgemäße Übungen
- Hilfsmittel verwenden
- Selbst entwickeln lassen
- Geduld
- Lob vor Tadel
- Fordern aber nicht überfordern
- Spaß`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-26`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind  methodische Hilfsmittel?`,answer:`- verbal, optisch, akustisch, taktil (Tastsinn), Geräte-/Partnerhilfen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-27`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind Lehrmethoden?`,answer:`Lernen erfolgt immer zwischen Lernenden, Lehrenden und dem Lerngegenstand (also hier der Bewegung). Dabei ist die Wahl der richtigen Methode für den Lernprozess wichtig. Nicht jede Methode ist den jeweiligen Bedingungen angemessen.
- darbietend (deduktiv): Trainer gibt Anweisungen und Vorschriften
- entwickelnd (induktiv): selbständiges Üben
- Ganzheits- und Teilmethode
- differenzielles Lernen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-28`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind methodische Reihen?`,answer:`Eine methodische Reihe ist eine Abfolge von Übungsschritten, mit denen eine bestimmte Bewegung schrittweise erlernt, verbessert oder automatisiert werden soll.
z.B. Weitsprung: Sprung aus dem Stand → Anlauf mit Sprung → Anlauf mit Sprung und Landung → Gesamtsprung
[Abbildung im Wiki]`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-29`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Aufbau einer Trainingseinheit`,answer:`- Trainingseinheit: Warm-up (allg./spez.), Technikteil, Konditionsteil, Ausklang → Belastungskurve beachten.
[Abbildung im Wiki]`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-30`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Motorisches Lernen`,answer:`- Traditionelles Lernen: Idealtechnik, Fehler vermeiden, Automatisierung
- Differenzielles Lernen: Nutzung von Abweichungen, Variabilität, Anpassungsfähigkeit
- Stufen: Grobform → Feinform → Feinstform
- Prinzipien: Voraussetzungen schaffen, Vielfalt ermöglichen, Kreativität anregen.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-31`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Unterschiede zwischen traditionellen und differenziellen Training`,answer:`- Traditionell: Idealtechnik, Fehler vermeiden, Automatisierung.
- Differenziell: Fehler & Variationen bewusst nutzen, Anpassungsfähigkeit fördern, dynamische und variabel
[Abbildung im Wiki]`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-32`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Lehr- und Lernstufen`,answer:`- Grobform - Grobkoordination
- Feinform - Feinkoordination
- Feinstform – individuelle Feinabstimmung
- Lernen - Üben
- Festigen – anwenden – variieren`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-33`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Erziehung Allgemein`,answer:`- Erziehung im engeren und weiteren Sinne ist ein komplexes Wirkungsgeschehen → keine Maßnahmen oder Stile haben Garantie auf Wirkung (aber auch nie wirkungslos)
- Erziehung ist Interaktiv → Kinder sind MITgestalter
- Abnehmende Fremdbestimmung → zunehmende Selbstbestimmung → Selbstverantwortung übernehmen → stetige Entwicklung`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-34`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Erziehung im engeren Sinne`,answer:`- Handlungen zwischen mindestens zwei Personen
- Kompetenzgefälle muss vorhanden sein, das überwunden werden soll
- Die Beeinflussung des Edukanden muss absichtlich erfolgen
- Das Erziehungsgeschehen geschieht aus der Verantwortung gegenüber dem Edukanden
- Erziehung strebt immer Ziele an (ranghöchste Ziel: Ermöglichung einer selbstbestimmten Lebensführung in sozialer Verantwortung)
- Erziehung ist ein Vermittlungsgeschehen
- absichtliche Einwirkung mit Kompetenzgefälle; Ziel = selbstbestimmte Lebensführung`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-35`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Erziehung im weiteren Sinne`,answer:`- Das Individuum ist fortlaufend Einflüssen ausgesetzt, die erzieherisch bedeutsam werden können.
- Erziehung findet oft auch unabsichtlich, nicht planmäßig statt
- Nicht nur einzelne Menschen erziehen, sondern die gesamte soziale Umwelt wirkt auf die Entwicklung der Edukanden ein (Erziehung im weiteren Sinne)
- Sozialisation → unabsichtliche, gesellschaftliche Einflüsse`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-36`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Die 10 Säulen für eine gelungene Kindererziehung`,answer:`1. Liebe
1. Wertschätzung
1. Motivation
1. Rituale
1. Regel & Konsequenz
1. Sicherheit
1. Vorbild
1. Freizeit
1. Förderung
1. Kommunikation`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-37`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind Erziehungsmethoden?`,answer:`- Überzeugen
- Angewöhnen
- Pädagogisch Stimulieren → Begeisterung statt Druck`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-38`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind Erziehungsziele?`,answer:`- Sportmotorische
- Affektive
- Kognitive
- Ästhetische
- Sozialpolitische
- Ethische
- Übergeordnete`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-39`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Drei Erziehungsperspektiven & der Doppelauftrag des Sportunterrichts`,answer:`- Erziehungsperspektiven:
  - Erziehung zum Sport: Motivation fördern, Bewegungsmöglichkeiten im Alltag wahrnehmen und nutzen, Sporträume aufsuchen
  - Erziehung im Sport: sportliche Werte vermitteln, Fairness fördern, Interessen weiter entwickeln
  - Erziehung durch Sport: Aufbau eines positiven Selbst-/Körper-Konzepts und Selbstwertgefühl, Soziales Lernen und verantwortliches Handeln fördern → Doppelauftrag des Schulsports
- Doppelauftrag des Schulsports:
  1. Entwicklungsförderung durch Bewegung/Sport/Spiel
  1. Erschließung der Bewegungs-, Spiel- und Sportkultur`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-40`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Welche Führungsstile gibt es?`,answer:`- Autoritär: Führungskraft entscheidet, strenge Regeln und klare Befehle
- Demokratisch / kooperativ: Entscheidungen werden gemeinsam getroffen (Austausch, Miteinander)
- Laissez-faire: sehr zurückhaltend, Gruppe arbeitet selbstständig
- Situativ: passt sich je nach Situation & Reifegrad der Gruppe an`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-41`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind Führungsinstrumente?`,answer:`- Gepflegte Kommunikation
- Beziehungsebene - Informationsebene
- Gemeinsame Zielvereinbarung und Identifikation
- Führung kann auch heißen auf Führung zu verzichten`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-42`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Was sind Führungsqualitäten?`,answer:`- Fachleute im Umgang mit Menschen
- Meiden von Demotivation
- Zwischenmenschliche Qualitäten
- Glaubwürdige Persönlichkeit
- Ethisches Verantwortungsbewusstsein
- Charisma
- Kommunikation (Information = WAS, Mitteilung = WIE, Verstehen)
- Wertschätzung
- Achtung
- Respekt
- Ehrlichkeit
- Offenheit
- Toleranz
- Empathie
- Authentizität
- Teamfähigkeit
- Vertrauen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-43`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Allgemein`,question:`Kernaussage`,answer:`- Pädagogik fragt nach Sinn und Verantwortung
- Didaktik nach Inhalten
- Methodik nach Vermittlungswegen
Ziel ist die ganzheitliche Entwicklung von Menschen durch Sport – motorisch, sozial, affektiv, kognitiv und ethisch.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-44`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Was ist Sportpädagogik, Sportdidaktik, Sportmethodik?`,answer:`- Sportpädagogik: Lehre von Erziehung/Bildung durch Sport (fragt nach Wozu/Warum).
- Sportdidaktik: Lehre von Inhalten des Unterrichts (fragt nach Was).
- Sportmethodik: Lehre von Vermittlungsverfahren (fragt nach Wie).`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-45`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Seit wann gibt es den Begriff Sportpädagogik?`,answer:`- Seit ca. 1970 ist er üblich, als Teilgebiet der Sportwissenschaft.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-46`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Funktionen hat Sportpädagogik?`,answer:`- Begründungs-, Orientierungs-, Tatsachen- und Beratungswissenschaft
Erziehung & Bildung`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-47`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Unterschied zwischen Erziehung und Bildung?`,answer:`- Erziehung: absichtliche Einwirkung mit Ziel vernünftiger Selbstbestimmung und ästhetischer Selbsterfahrung.
- Bildung: Selbstgestaltung durch Auseinandersetzung mit Inhalten/Werten der Bewegungskultur.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-48`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Arten von Erziehung im Sport unterscheidet man?`,answer:`- Erziehung zum Sport (Motivation), im Sport (Regeln, Fairness), durch Sport (Persönlichkeitsbildung).`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-49`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche sportlichen Erziehungsziele nennt Meusel?`,answer:`- Sportmotorische, affektive, kognitive, ästhetische, sozialpolitische, ethische Ziele.
Sportunterricht & Sinnperspektiven`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-50`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Unterschied Sportunterricht vs. Bewegungsunterricht?`,answer:`- Sportunterricht: orientiert an Sportarten, Technik, Normen.
- Bewegungsunterricht: orientiert an Entwicklungsförderung, Kreativität, entdeckendes Lernen.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-51`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Was ist der Doppelauftrag des Schulsports?`,answer:`1. Entwicklungsförderung durch Bewegung, Spiel, Sport → Die Bewegung ist nicht nur Selbstzweck, sondern ein pädagogisches Mittel zur Persönlichkeitsentwicklung → Erziehung durch Sport
1. Erschließung der Bewegungs-, Spiel- und Sportkultur → Die Schüler sollen in die Bewegungskultur hineinwachsen, sie verstehen, mitgestalten und sich darin selbstwirksam erleben → Erziehung zum Sport`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-52`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Nenne die pädagogischen Sinnperspektiven von Kurz/Miethling.`,answer:`- Leistung, Miteinander, Eindruck, Ausdruck, Wagnis, Gesundheit
Methodik`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-53`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Was ist Methodik im Sport?`,answer:`- Lehre von planmäßigen Verfahren, um Inhalte mit einfachen Mitteln schnell, sicher und erfolgreich zu vermitteln.
- Wie Inhalte vermittelt und aufgebaut werden, damit Lern- und Trainingsziele effizient erreicht werden.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-54`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Allgemeine methodische Grundsätze?`,answer:`- Vom Leichten zum Schweren, vom Einfachen zum Komplexen, vom Bekannten zum Unbekannten, altersgemäß, Hilfsmittel nutzen, Geduld, Lob vor Tadel, Spaß.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-55`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Lehrmethoden gibt es?`,answer:`- Darbietend (deduktiv), entwickelnd (induktiv), Ganzheitsmethode, Teilmethode, differenzielles Lernen.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-56`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Was versteht man unter methodischen Reihen?`,answer:`- Abfolge von Übungen: vorbereitend → zielgerichtet → festigend. Prinzipien: verminderte Lernhilfe, graduelle Annäherung, Aufgliederung.`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-57`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Was sind methodische Hilfsmittel?`,answer:`- Verbale, optische, akustische, taktile, Geräte-/Geländehilfen, Partnerhilfe
Motorisches Lernen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-58`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Lernstufen gibt es?`,answer:`- Grobform (Grobkoordination), Feinform (Feinkoordination), Feinstform (Feinstabstimmung)
Führung & Kommunikation`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-59`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Führungsstile gibt es?`,answer:`- Autoritär, demokratisch, laissez-faire, situativ`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-60`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Eigenschaften zeichnen eine gute Führungskraft im Sport aus?`,answer:`- Wertschätzung, Achtung, Ehrlichkeit, Offenheit, Toleranz, Empathie, Authentizität, Teamfähigkeit`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-61`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Formen der Kommunikation gibt es?`,answer:`- Information (Was), Mitteilung (Wie), Verstehen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-62`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Unterschied asymmetrische vs. symmetrische Kommunikation?`,answer:`- Asymmetrisch: Hierarchie (Trainer gibt an, Athlet führt aus)
- Symmetrisch: Partnerschaftlich, Austausch von Wissen, Bedürfnissen, Erfahrungen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-63`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Warum ist Vertrauen wichtig?`,answer:`- Vertrauen schafft positive Zukunftserwartungen und ist Grundlage für Zusammenarbeit.
Trainerkompetenzen`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-64`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche Kompetenzen braucht ein Trainer?`,answer:`- Selbstkompetenz, Sozialkompetenz, Sachkompetenz`},{id:`Sportpädagogik / Sportmethodik 🧑‍🏫-65`,topic:`Sportpädagogik / Sportmethodik 🧑‍🏫`,section:`Fragen`,question:`Welche menschlichen Fähigkeiten ergänzen das Fachwissen?`,answer:`- Selbstreflexion, Überzeugungskraft, Kritikfähigkeit, Kommunikationsfähigkeit, Auftreten, Zuhören, Empathie, …`},{id:`Gerätekunde Muradin ⚙️-1`,topic:`Gerätekunde Muradin ⚙️`,section:`Allgemein`,question:`1) Nennen Sie 4 Gründe warum Trainingsmaschinen gebaut werden! (GK03)`,answer:`- Wirksameres Training: Muskel isoliert trainieren + an Kraftkurve angepasst → Exzenter
- Effizienteres Training: Zeiterparnis durch Steckgewichte
- Sichereres Training: Risiko falscher Technik und Verletzungen ist reduziert → geführte Bewegungen → besonders geeignet für Anfänger, ältere Menschen, Reha
- Abwechslungsreicheres Training: viele verschiedene Geräte und Varianten → mehr Spaß und Motivation
- Komfortableres: Einfach, Sitzen, vorgegebene Einstellungen und Bewegungsführung
- Nachvollziehbares / Reproduzierbares Training + bessere Progression: reproduzierbare Einstellungen und Gewichte (Widerstand lässt sich exakt einstellen)
- Ergonomischer: gut an den menschlichen Körper angepasst
- Einfache Handhabung: Klare Vorgaben und Einstellungen`},{id:`Gerätekunde Muradin ⚙️-2`,topic:`Gerätekunde Muradin ⚙️`,section:`Allgemein`,question:`2) Welche Kenntnisse benötigt man um Trainingsgeräte zu bauen? Nennen Sie mind. 8 Bereiche! (GK03)`,answer:`1. menschliche Anatomie
  - Wie ist der Körper aufgebaut (Struktur)
  - Kenntnis von Muskelursprung und -ansatz, Gelenkbewegungen, Bewegungsrichtungen (z. B. welche Muskeln sind bei einer Beinpresse aktiv)
1. Physiologie
  - Wissenschaft von den Lebensvorgängen und Funktionen im Körper eines Lebewesens
  - wie funktionieren  Zellen, Gewebe und Organe und wie diese zusammenwirken, um den Organismus am Leben zu erhalten und seine Aufgaben zu erfüllen
  - Wissen über Muskelkontraktionen (isometrisch, konzentrisch, exzentrisch), Energiebereitstellung (aerob, anaerob), Anpassungsmechanismen durch Training (Hypertrophie, Ausdauersteigerung)
  - Erholungsprozesse und Belastungsgrenzen des Körpers
1. Biomechanik
  - Untersucht Bewegungsabläufe, Kräfte und deren Wechselwirkungen → Bewegungen verstehen
  - Analyse von Kraftverläufen, Drehmomenten, Hebelarmen, um Bewegungen gelenk- und muskelschonend zu gestalten
1. Maschinenbau
  - Konstruktion von stabilen Rahmen, Auswahl passender Lager, Schweißtechniken, Materialwahl für Sicherheit und Langlebigkeit
1. Physik
  - Berechnung von Kräften, Reibung, Beschleunigung, Seilzugverhältnissen und Übersetzungen in Kraftmaschinen
1. Messtechnik
  - Einsatz von Kraft- und Wegsensoren, Prüfung von Materialbelastung, Messen von Bewegungswinkeln zur Qualitätskontrolle
1. Regeltechnik
  - Entwicklung von Systemen für variable Widerstände (hydraulisch, elektrisch), Steuerung von Motoren oder pneumatischen Bremsen.
1. Ergonomie
  - Anpassung der Geräte an unterschiedliche Körpergrößen, bequeme Griffpositionen, sichere Bewegungsbahnen, intuitive Bedienung
1. Materialwissenschaften
  - Auswahl geeigneter Materialien für Belastbarkeit, Haltbarkeit und Sicherheit
1. Design
  - Nutzerfreundliche, funktionale und ansprechende Gestaltung der Geräte`},{id:`Gerätekunde Muradin ⚙️-3`,topic:`Gerätekunde Muradin ⚙️`,section:`Allgemein`,question:`3) Die Gegensätze: Mensch / Maschine. Nennen Sie mind. 6! (GK05)`,answer:`| Maschine | Mensch |
| --- | --- |
| Totes (mechanisches) System | Lebendiges (biomechanisches) System |
| Technologie | Anatomie |
| Einfaches Regel- und Steuerwerk | Extrem komplexes Regel- und Steuerwerk |
| Einfache Sicherungen | Vielfache Sicherungen |
| Starre Achsen | Bewegliche Achsen erwünscht |
| Starre Materialien | Elastische Materialien |
| Keine Anpassung an Überlast | Anpassung durch Überkompensation |
| Reparatur | Selbstheilung |
| Leistung konstant | Leistung variabel (müde) |
| Elektrische oder mechanische Energie | Chemische Energie durch Nahrung |
| Abnützung durch Verschleiß | Abnützung durch inadäquate Nutzung |
| Keine Regeneration | Regeneration durch Stoffwechsel |
| Wertminderung | Wertsteigerung |
| Leistungsminderung durch Benutzung | Leistungssteigerung durch Benutzung |
| Use it AND lose it | Use it OR lose it |`},{id:`Gerätekunde Muradin ⚙️-4`,topic:`Gerätekunde Muradin ⚙️`,section:`Allgemein`,question:`4) Welche 4 verschiedenen Kraftgerätearten kennen Sie? Nennen Sie jeweils 1 Beispiel! (GK39 + GK61)`,answer:`1. Freie Gewichte → Freies Bewegen (Kurzhantel, Langhantel, Scheiben, Bänke …)
  - erlauben jede Art von Bewegung im Raum
  - entsprechen den Gelenksvorgaben
  - sind aber schwerkraftabhängig und entsprechen, deshalb oft nicht der Kraftkurve des Muskels
1. Kabel- und Seilzüge → Richtungsgeführtes Bewegen (Kabelzugmaschinen)
  - vielseitig
  - Widerstand am Beginn & Ende der Bewegung
  - schwerkraftunabhängig (bzw. nur der Block ist schwerkraftabhängig)
1. Geführte Kraftgeräte → Geführtes Bewegen → Achsentrainingsmaschinen (Steckgewichte, Scheiben, Federn, Gummi)
  - Vorteile sind Exzenter (optimale Anpassung an Kraftlurve)
  - Nachteil ist, dass die Achsenstimmigkeit oftmals durch die Bewegung nicht mehr möglich ist
1. Hydraulische oder pneumatische Geräte → Geführtes Bewegen und vorgegebene Geschwindigkeiten → Achsentrainingsmaschinen (isokinetische und desmodronische Maschinen)
  - wird oft in Reha benutzt
- Positiv dynamisch: konzentrisch, beschleunigend
- Negativ dynamisch: exzentrisch, abbremsend
- Isometrisch: Muskelspannung gegen Widerstand ohne Bewegung → haltend & statisch
- Isotonisch: Bewegung mit gleicher Muskelspannung → nur theoretisch möglich, da sich ändernde Gelenkswinkel und Muskellängen keine gleiche Spannung ermöglichen
- Auxotonisch: kombiniert isometrisch und isotonisch → veränderliche Spannung (Beginn statisch, dann negativ dynamisch und dann positiv dynamisch → Beinstrecker)
- Desmodromisch → gleiche maximale Spannung bei vorgegebener maximaler Geschwindigkeit
- Isokinetisch (computergesteuert) → genau definierte Bewegungen mit konstanter Geschwindigkeit`},{id:`Gerätekunde Muradin ⚙️-5`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`6) Welchen Zweck erfüllen Exzenter bzw. Unrundscheiben bei Trainingsmaschinen? Erklären Sie die Wirkung. (GK 54 - GK 58 / GK 62 / GK 69)`,answer:`Problem bei einfachen Maschinen (runde Umlenkrollen / konstante Hebelarme):
- Der Widerstand bleibt immer gleich
- Die Kraft, die ein Muskel während der Bewegung leisten kann, ist aber nicht konstant – sie hängt vom Gelenkwinkel ab (Kraft-Längen-Kurve, Kraft-Winkel-Kurve)
- Muskeln sind nicht in jeder Position gleich stark
- Ergebnis: In manchen Bewegungsabschnitten ist die Last zu leicht, in anderen zu schwer
Beispiel: Beim Bizepscurl ist der Muskel in der Mitte der Bewegung am stärksten, am Anfang und Ende schwächer.
Was
- Eine nicht kreisrunde Scheibe, die sich beim Drehen nicht gleichmäßig bewegt.
- Sie verändert den Widerstand über den Bewegungsablauf.
- Häufig als Nockenscheibe in Kraftgeräten (z. B. von Technogym, Nautilus) verbaut.
Wirkung
Sie verändert den Widerstand so, dass er zur natürlichen Kraftfähigkeit des Muskels passt → verändert den Hebelarm (Kraftarm)
Das bedeutet:
- In schwachen Gelenkpositionen ist der Widerstand geringer
- In starken Positionen wird der Widerstand größer
Vorteile in der Praxis:
- Optimale Muskelbelastung über die gesamte Bewegung
- Schonung von Gelenken in biomechanisch ungünstigen Positionen
- Geringeres Verletzungsrisiko
- Effizienteres Training (mehr Zeit unter Spannung)
Exzenter- oder Unrundscheiben sorgen dafür, dass der Widerstand während einer Bewegung optimal an die Kraftfähigkeit des Muskels angepasst wird, wodurch das Training effizienter und gelenkschonender wird.
mehr im Buch!`},{id:`Gerätekunde Muradin ⚙️-6`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`7) Welche Arten von Rollen findet man bei einem Flaschenzug? Welche Wirkung hat dieser? Erklären Sie warum. (GK71)`,answer:`1. Feste Rolle
  - gleiche Kraftübertragung → du musst genauso viel Kraft aufbringen wie die Last wiegt
  - Vorteil: Du kannst z. B. nach unten ziehen, obwohl die Last nach oben bewegt wird
  - Die Rolle ist stationär befestigt (z. B. an der Decke oder am Kabelturm).
  - Sie verändert nicht die Kraft, sondern nur die Richtung.
  - z.B. Latzug oder Trizepsdrücken
1. Bewegliche Rolle
  - Kraftgewinn auf Kosten des Weges. Mehr Kraft = Mehr Weg → Du musst nur die halbe Kraft aufbringen – dafür den doppelten Weg ziehen
  - Die Rolle ist mit der Last verbunden und bewegt sich mit
  - Sie halbiert die nötige Kraft, v
  - erteilt sie aber auf eine größere Wegstrecke
  - z.B. Bei manchen Seilzügen mit Umlenkrollen an einer Beinpresse oder in der Physiotherapie
1. Kombination → Flaschenzug
  - Eine Kombination aus festen und losen Rollen
  - Ziel: Kraft reduzieren und/oder Zugrichtung anpassen
  - Je nach Anzahl der losen Rollen kannst du die benötigte Kraft weiter reduzieren.
Arbeit = Kraft * Weg
Je mehr Rollen, desto weniger Gewicht, desto länger Seil. Zwei Rollen halbieren Gewicht.
Flaschenzug = Verbindung von beweglicher und fester Rolle`},{id:`Gerätekunde Muradin ⚙️-7`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`8) Sie richten ein Fitnessstudio ein. Welche 20 Trainingsmaschinen würden Sie auswählen? (Keine Bänke, Hanteln, Cardiogeräte).`,answer:`1. Beinpresse Horizontal → Training der gesamten Beine
  - Rückenschonend + Gelenkschonend + Ideal für Anfänger
  - Weniger Muskelaktivierung als 45 Grad
1. Beinpresse 45 Grad
  - Gelenkschonender als frei Kniebeugen + Mehr Muskelaktivierung (Quadrizeps, Gesäß)
  - Etwas mehr Belastung auf LWS → Fortgeschrittene
1. Beinpresse Vertikal
  - Starke Aktivierung von Quadrizeps & Beinbeuge
  - Hohe Belastung auf Rücken und Knie → Fortgeschrittene
1. Hack Squat → Kniebeugenähnlich
  - Fokus auf Quadrizeps
  - Weniger Core-Aktivierung
1. Beinbeuger
1. Beinstrecker
1. Abduktoren
1. Adduktoren
1. Wadenmaschine stehend
  - Trainiert Gastrocnemius (oberflächlicher Wadenmuskel)
1. Wadenmaschine sitzend
  - Gastrocnemius ausgeschaltet → mehr Soleus (tiefer Wadenmuskel) + Gelenkschonender
1. Hip Thrust Maschine
1. Bauchmaschine für gerade Bauchmuskeln
1. Bauchmaschine für seitliche Bauchmuskeln
1. Rückenmaschine
1. Brustpresse
1. Butterflymaschine
1. Schulterdrücken
1. Latzugmaschine
1. Ruderzugmaschine
1. Bizeps
1. Trizeps
1. Seitheben
1. Klimmzughilfe
1. Multipresse
1. Dips
1. Kabelzug
1. Multihip`},{id:`Gerätekunde Muradin ⚙️-8`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`9) Was bedeutet Ergonomie und wozu dient Sie? Was heißt Ergonomie für Fitnessmaschinen? (GK51 + GK52)`,answer:`Anpassung von Geräten und Maschinen an den Menschen
- Ziele
  - Sichere, komfortable, effektive und gesunde Nutzung von Geräten und Umgebungen
  - Vermeidung von Fehlbelastungen und Verletzungen
  - Verbesserung von Bewegungsabläufen und Komfort
  - Erhöhung der Trainingsqualität und Langzeitmotivation
  - Individuelle Anpassbarkeit (z. B. an Körpergröße, Beweglichkeit)
  - Geräte sind so gebaut, dass sie sich optimal an die Körperproportionen und Bewegungsmuster des Trainierenden anpassen lassen.
  - Für Geräte heißt das, dass sie so gebaut sein müssen, dass unterschiedlich große Menschen darauf trainieren können
- Wissen über
  - Man muss wissen von wo bis wo ein Muskel verläuft, Ursprung und Ansatz, Anzahl der Muskelköpfe, die Bewegungsrichtung und die Rotationsbewegungen müssen berücksichtigt werden
  - Man muss wissen welche Art Gelenke bewegt werden → Gelenksachsen und Gelenksamplituden
  - wissen, ob eine ein- und oder mehrgelenkige Bewegung abläuft
    - eingelenkig = Rotationsbewegungen
    - mehrgelenkig = Rotationsbewegung + geradlinig oder kurvige Bewegung
  - man muss die physikalischen Gesetze kennen (Schwerkraft, Beschleunigugn, Masse, Gewicht, Trägheit, …)
- Beispiele:
  - Verstellbare Sitzhöhe, Rückenlehne, Polster, Hebelarme
  - Natürliche Bewegungsbahnen (gelenkschonend)
  - Griffpositionen, die der Anatomie entsprechen
  - Leicht erreichbare Bedienelemente und Gewichtsverstellung
Für Fitnessmaschinen heißt Ergonomie: einstellbare, körpergerechte Geräte, die natürliche Bewegungen ermöglichen, die Gelenke entlasten und die Muskelkraftkurven sinnvoll berücksichtigen.`},{id:`Gerätekunde Muradin ⚙️-9`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`10) Welche Arten von Hebel gibt es? Nennen Sie das Hebelgesetz. (GK65) → Beispiele nochmal checken`,answer:`Einseitiger Hebel
- Kraft und Last befinden sich auf einer Seite des Drehpunktes
- Hebel 2. Klasse (Last liegt zwischen Drehpunkt und Kraft) → Kraftarm > Lastarm → Kraftvorteil
  - z.B.: Wadenheben (Kraft = Wadenmuskulatur, Last = Körpergewicht, Drehpunkt = Zehenballen)
- Hebel 3. Klasse (Kraft liegt zwischen Drehpunkt und Last) → Lastarm > Kraftarm → Geschwindigkeitsvorteil, Beweglichkeit, aber hoher Kraftaufwand nötig
  - z.B.: Bizepscurls (Kraft = Bizeps, Last = Hantel, Drehpunkt = Ellbogengelenk) oder
Zweiseitiger Hebel → Hebel 1. Klasse
- Kraft und Last befinden sich auf den gegenüberliegenden Seiten des Drehpunktes
- Reverse Flys (Drehpunkt: Schultergelenk, Kraft: hintere Schultermuskulatur, Last: Hanteln oder Kabelzug) oder Plate Loaded Maschinen
- Last+Kraftarm in eine Richtung wirksam
- Kann Kraft verstärken oder Bewegung beschleunigen, je nach Hebelarm.
Hebelgesetz → Kraft * Kraftarm = Last * Lastarm
- Ein kleiner Kraftaufwand kann eine große Last bewegen, wenn der Kraftarm länger ist als der Lastarm.
- Entscheidend ist das Verhältnis der Abstände vom Drehpunkt (Hebelarm).
  - Langer Kraftarm = kleine Kraft reicht
  - Kurzer Kraftarm = große Kraft nötig
z.B. Seitheben mit 8kg → Lastarm = Abstand von Schulter bis Hand = 0,6 m,  Kraftarm = Abstand von Schulter bis Muskelansatz des Deltamuskels = 0,06 m, Gesucht: Muskelkraft, die nötig ist.
Kraft * 0,06 = 8kg * 0,6 → 8 * 0,6 / 0,06 = 80kg → deshalb fühlt sich Seitheben so schwer an → Deltamuskel muss eine Kraft von 80kg aufbringen`},{id:`Gerätekunde Muradin ⚙️-10`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`11) Wie berechnen Sie die tatsächliche Belastung bei einer schrägen Beinpresse mit Scheibenbeladung? (GK 73-75)`,answer:`1. Kraft = Gewicht * sin (Grad) → z.B. Kraft = 150kg * sin(45) = 106,07kg
oder
1. Kraft = Gewicht * (Höhe Gerät / Länge Schlittenbahn)`},{id:`Gerätekunde Muradin ⚙️-11`,topic:`Gerätekunde Muradin ⚙️`,section:`Schwerkraftunabhängig`,question:`12) Nennen Sie mind. 5 Anforderungen, die wir heute an moderne Trainingsmaschinen stellen!`,answer:`- Sicher → geringes Verletzungsrisiko für sich selbst und andere
- Zweckentsprechend (Reha, Fitness, Männer/Frauen)
- Ergonomisch → richtig einstellbar
- Einfach und verständlich zu bedienen
- Langlebig & qualitativ → gute Verarbeitung
- Anatomisch / physiologisch korrekt → richtige Funktion, keine Schädigung
- Wartungsarm → wenig Personalaufwand, wenige Ölungen, wenig Reparaturen, wenig Pflege
- Gutes Preis- Leistungsverhältnis
- Optisches Aussehen
- Überwachungsfunktion (Herzmessung)
- Zähl- und Kontrollfunktionen (Kalorien, Taktgeber, Zähler, …)
- Leistungsparameter (Tests, Programme)`},{id:`Grundlagen des Krafttrainings 🏋-1`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`1) Nennen Sie die Bestandteile des Muskel – Sehnenkomplexes bis in die kleinsten Bereiche!`,answer:`Myologie = Muskelkunde
1. Muskel (Muskulus)
  - Das Organ
  - Besteht aus vielen Muskelfaserbündeln (Faszikel)
  - Umgeben von Bindegewebe (Epimysium)
1. Muskelfaserbündel (Faszikel)
  - Bündel aus vielen Muskelfasern
  - Umgeben von Bindegewebe (Perimysium)
1. Muskelfaser (Muskelzelle)
  - Längliche, mehrkernig Zellen
  - Enthält Myofibrillen
  - Umgeben von Bindegewebe (Endomysium)
1. Myofibrillen
  - Feinste Strukturen in der Muskelfaser
  - Bestehen aus Sarkomeren (funktionelle Einheit der Muskelkontraktion)
1. Sarkomer
  - Kleinste kontraktile Einheit
  - Enthält Myofilamente → Aktin (dünne Filamente) und Myosin (dicke Filamente)
  - + Z-Scheiben und Titin und Nebulin
1. Sehne
  - Besteht aus dicht gepacktem kollagenem Bindegewebe
  - Verbindet Muskel mit Knochen
  - Überträgt Muskelkraft auf das Skelett
1. Bindegewebe
  1. Endomysium
    - Feine Bindegewebshülle um einzelne Muskelfasern
  1. Perimysium
    - Bindegewebsschicht um Muskelfaserbündel
  1. Epimysium
    - Umgibt den gesamten Muskel (äußere Hülle)`},{id:`Grundlagen des Krafttrainings 🏋-2`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`2) Was versteht man bei Muskeln unter den Begriffen: Ursprung, Ansatz bzw. punktum fixum und punktum mobile?`,answer:`Ursprung (Origo)
- Der fest am Körper fixierte Muskelansatz
- Befindet sich meist proximale (körpernah) am Knochen
- Bleibt bei einer Bewegung meist stationär
Ansatz (Insertio)
- Der Muskelteil, der sich bei Kontraktion zum Ursprung hin bewegt
- Befindet sich meist distal (körperfern) am Knochen
- Hier wird die Bewegung sichtbar, da dieser Teil verschoben wird
Beim Bizeps brachii ist der Ursprung an der Scapula (Schulterblatt), der Ansatz an der Speiche (Radius) → beim Beugen des Ellbogens zieht der Ansatz Richtung Ursprung.
Punktum fixum (Fixpunkt)
- Der stabile Gelenkpunkt oder Knochen, der bei der Muskelarbeit nicht bewegt wird
- In der Regel der Ursprung
- Der fixierte Punkt bei der Bewegung
Punktum mobile (Beweglicher Punkt)
- Der bewegte Teil, der durch Muskelkontraktion bewegt wird
- In der Regel der Ansatz
- Der bewegliche Punkt bei der Bewegung
Kann sich vertauschen → z.B. beim Klimmzug: Schulterblatt bewegt sich in Richtung Speiche`},{id:`Grundlagen des Krafttrainings 🏋-3`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`3) Es gibt unterschiedliche Muskelformen. Nennen Sie mindestens 5 verschiedene!`,answer:`Nach Zahl der Ursprünge (Köpfe):
  - Einköpfig → z. B. gluteus maximus
  - Zweiköpfig (Bizeps)
  - Dreiköpfig (Trizeps)
  - Vierköpfig (Quadrizeps)
Nach Zahl der Muskelbäuche:
  - Ein Bauch (die meisten Muskeln)
  - Zwei Bäuche (z. B. M. digastricus im Hals)
  - Mehrbäuchig mit Zwischensehnen (z. B. M. rectus abdominis mit seinen „Sixpack“-Zwischensehnen)
Nach Sehnenanordnung:
  - Einzelsehnig (ein Ansatz, z. B. M. semitendinosus am Oberschenkel)
  - Mehrfach sehnig (z. B. M. rectus abdominis mit Zwischensehnen)
Besondere Formen:
  - Sägemuskel (z. B. M. serratus anterior)
  - Einfach gefiedert (z. B. M. extensor digitorum longus)
  - Doppelt gefiedert (z. B. M. rectus femoris)
  - Mehrfach gefiedert (z. B. M. deltoideus)
[Abbildung im Wiki]`},{id:`Grundlagen des Krafttrainings 🏋-4`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`4) Von welchen Faktoren ist die maximale Kraft eines Muskels abhängig? Nennen Sie mindestens 5 Faktoren!`,answer:`1. Physiologischer Querschnitt des Muskels (Muskelgröße)
  - Je größer der Muskelquerschnitt, desto mehr Muskelfasern → höhere Kraft.
1. Faserverlauf / Muskelform
  - Parallelfaserig = mehr Hub, weniger Kraft.
  - Gefiedert = mehr Fasern pro Fläche → größere Kraft.
1. Muskelfasertypen
  - Anteil an FT-Fasern (fast-twitch, Typ II) → höhere Kraftfähigkeit.
  - ST-Fasern (slow-twitch, Typ I) → eher ausdauernd.
1. Rekrutierung der motorischen Einheiten
  - Je mehr motorische Einheiten gleichzeitig aktiviert werden, desto größer die Kraft.
1. Frequenzierung der Impulse
  - Höhere Nervenimpulsfrequenz → stärkere Summation → mehr Kraft.
1. Synchronisation
  - Gleichzeitige Aktivierung vieler Muskelfasern → höhere Maximalkraft.
1. Muskel-Länge-Spannungs-Verhältnis
  - Maximale Kraft bei mittlerer Dehnung (optimale Sarkomerlänge).
1. Hebelverhältnisse / Gelenkwinkel
  - Biomechanische Hebelwirkung beeinflusst die Krafteffizienz.
1. Intramuskuläre und intermuskuläre Koordination
  - Zusammenspiel innerhalb eines Muskels und mit Synergisten/Antagonisten.
1. Motivation und Animation
1. Tagesverfassung (gut drauf sein)
1. Ernährung und Hydration`},{id:`Grundlagen des Krafttrainings 🏋-5`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`5) Bei wieviel Prozent der maximalen Kraft wird der Muskel nicht mehr durchblutet?`,answer:`Der Blutfluss im Muskel kommt ab einer Intensität von etwa 50 % der Maximalkraft komplett zum Erliegen, wodurch die Energieverbrennung im Muskel auf einen anaeroben Stoffwechsel umgestellt wird und der Muskel beginnt, ohne Sauerstoff zu arbeiten.`},{id:`Grundlagen des Krafttrainings 🏋-6`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`6) Was versteht man unter a) Rekrutierung b) Frequenzierung c) Synchronisation?`,answer:`a) Rekrutierung
- Das Hinzuschalten weiterer motorischer Einheiten (Muskelfasern mit ihrem Nerv) zur Kraftsteigerung → Je mehr Muskelfasern aktiviert werden, desto größer die Muskelkraft.
b) Frequenzierung
- Die Erhöhung der Feuerrate der motorischen Einheiten (wie schnell die Nervenimpulse hintereinander kommen) → Effekt: Schnellere Impulse führen zu einer stärkeren und längeren Muskelkontraktion (Tetanus) → wie oft die Muskelfasern angesteuert werden
c) Synchronisation
- Das gleichzeitige Aktivieren vieler motorischer Einheiten → Effekt: Verbesserte Kraftentfaltung durch koordiniertes Anspannen vieler Muskelfasern zur gleichen Zeit → mehrere Fasern zur gleichen Zeit ansteuern`},{id:`Grundlagen des Krafttrainings 🏋-7`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`7) Wieviel Prozent der Maximalkraft gelten als Schwellenwert zur Adaption des Muskels: a) bei Anfängern b) bei gut Fortgeschrittenen.`,answer:`- Anfänger: 40-50%
- Fortgeschrittene: > 70% → da ihre Muskeln schon stärker sind und höhere Reize benötigen.`},{id:`Grundlagen des Krafttrainings 🏋-8`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`8) Was bezeichnet man als aktive bzw. passive Insuffizienz bei mehrgelenkigen Bewegungen? Nennen Sie jeweils ein Beispiel und begründen Sie auch warum es zu dieser Bewegungseinschränkung kommt!`,answer:`Aktive Insuffizienz → zu kurz für Kraft
- Definition: Ein Muskel kann sich nicht mehr weiter kraftvoll zusammenziehen, weil er bereits stark verkürzt ist → Muskel zu kurz für weitere Kraft
- Warum? → Die Muskel-Filamente (Aktin und Myosin) überlappen sich zu stark, wodurch keine weitere Kraftentwicklung möglich ist.
- Beispiel: Wenn du in der tiefen Hocke bist und die Ferse hochdrücken willst → Wade zu kurz, wenig Kraft.
Passive Insuffizienz → zu lang für Dehnung
- Definition: Ein Muskel kann nicht weiter gedehnt werden, weil er bereits maximal gedehnt ist und dadurch die Bewegung an den beteiligten Gelenken eingeschränkt wird → Muskel zu lang für weitere Dehnung
- Warum? → Der Muskel und die Sehne sind gespannt und verhindern eine weitere Gelenkbewegung.
- Beispiel: Oberschenkelrückseite (Hamstrings): Wenn du dich mit gestreckten Beinen vorbeugst → Rückseite ist maximal gedehnt, du kommst nicht weiter runter.`},{id:`Grundlagen des Krafttrainings 🏋-9`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`9) Welche Ebenen und Achsen bei den Bewegungen kennen Sie ?`,answer:`| Ebenen | Achsen | Bewegungen | Beispiele |
| --- | --- | --- | --- |
| Sagittale Ebene → teilt den Körper in links und rechts | Transversale Achse | Flexion (Beugung) / Extension (Streckung) | Kniebeugen, Laufen, Bankdrücken |
| Frontalebene → teilt den Körper in vorne und hinten | Sagittale Achse | Abduktion / Adduktion | Seitheben, Seitliches Ausfallschritt |
| Transversale Ebene → teilt den Körper in oben und unten | Longitudinale Achse | Rotation | Russian Twists, Kettlebell Drehungen |`},{id:`Grundlagen des Krafttrainings 🏋-10`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`10) In/aus welchen Postitionen können Übungen ausgeführt werden?`,answer:`1. Standpositionen: aufrecht, breit/eng, parallel oder Schrittstellung → z. B. Kniebeuge, Ausfallschritt
1. Sitzpositionen: frei sitzend oder mit Stütze/Lehne → z. B. Schulterdrücken im Sitzen
1. Rückenlage (supin): flach, mit aufgestellten Beinen oder gestreckten Beinen → z. B. Crunches, Bankdrücken
1. Bauchlage (prone): gestreckt oder auf Ellbogen abgestützt → z. B. Superman, Back Extension
1. Seitlage: auf rechtem oder linkem Arm/Hüfte abgestützt → z. B. Side Plank, Beinheben seitlich
1. Kniestand / Vierfüßlerstand: auf beiden Knien (Kniestand) oder Händen+Knien (Vierfüßler) → z. B. Bird Dog im Vierfüßler
1. Hangposition: passiv (toter Hang) oder aktiv (Schultern stabilisiert) → z. B. Klimmzüge, Hanging Leg Raises
1. Stützposition: Arme oder Beine tragen den Körper → z. B. Liegestütz, Dips, Plank`},{id:`Grundlagen des Krafttrainings 🏋-11`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`11) Geben Sie Beispiele für den Unterkörper, Oberkörper und Rumpf wo „punctum fixum“ und „punctum mobile“ vertauscht werden.`,answer:`Unterkörper (Bein)
- Normale Bewegung: M. quadriceps femoris → Ursprung (Femur/Becken) fix, Ansatz (Tibia) bewegt → Knie streckt sich, Unterschenkel bewegt sich nach vorne.
- Umkehrung (Beinpresse): Füße stehen fix auf der Druckplatte → Ansatz (Tibia) fix, Ursprung (Becken) bewegt sich → das Becken/Körper wird nach hinten gedrückt.
Oberkörper (Arm)
- Normale Bewegung: M. biceps brachii → Ursprung (Scapula) fix, Ansatz (Radius) bewegt → Ellbogenbeugung
- Umkehrung: Beim Klimmzug sind die Hände fix → der Körper/Schultergürtel wird hochgezogen → Ansatz fix, Ursprung bewegt sich.
Rumpf
- Normale Bewegung: M. rectus abdominis → Ursprung (Rippen) fix, Ansatz (Schambein) bewegt → Becken kippt nach hinten.
- Umkehrung: Beim Sit-up sind die Beine fixiert → Brustkorb bewegt sich nach vorne/oben → Ansatz fix, Ursprung bewegt sich.`},{id:`Grundlagen des Krafttrainings 🏋-12`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`12) Erläutern Sie den anatomischen und den physiologischen Querschnitt eines Muskels.`,answer:`Anatomischer Querschnitt:
- Beschreibt die Fläche des Muskels, die senkrecht zur Längsachse verläuft
- Erfasst die Fläche des Muskels unabhängig von der Faseranordnung
- Er dient der Beschreibung der Größe eines Muskels an seinem dicksten Punkt, jedoch weniger zur direkten Aussage über die Kraftentwicklung
  - → bei parallelfaserigen Muskeln entspricht er fast dem physiologischen Querschnitt. → parallel zur Zugrichtung und im rechten Winkel zur Muskelfaserrichtung
  - → bei gefiederten Muskeln unterschätzt er die tatsächliche Kraftfähigkeit, weil die Fasern schräg zur Längsachse verlaufen → Quadrizeps →
Physiologischer Querschnitt:
- Senkrecht zur Faseranordnung → wie dick + wieviele Muskelfasern
- Beschreibt die aktive Anzahl der Muskelfasern in einer bestimmten Ebene des Muskels, die zur Kraftproduktion beitragen.
- Ein größerer physiologischer Querschnitt bedeutet mehr Kraftentfaltung, auch bei kleinerer Gesamtgröße des Muskels.`},{id:`Grundlagen des Krafttrainings 🏋-13`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`13) Welche Auswirkungen auf die Kraft haben die Vordehnung bzw. Die Verkürzung eines Muskels?`,answer:`Vordehnung:
- Wenn der Muskel gedehnt wird, kann er danach mehr Kraft entwickeln. Dies geschieht durch den Dehnungs-Reflex und die Elastizität des Gewebes→ die Aktin- und Myosin-Filamente überlappen sich optimal
- Bei Vordehnung (Muskel länger als Ruhestellung):
  - Weniger Überlappung → weniger aktive Querbrücken → aktive Kraft sinkt
  - ABER: elastische Elemente (Sehnen, Titin) spannen sich → passive Kraft steigt
- Summe aus aktiver + passiver Kraft = höchste Gesamt-Kraft in leicht vorgedehnter Position → In der Praxis (z. B. Sprung, Ausholbewegung):
- Die Dehnungs-Verkürzungs-Zyklus-Energie (elastische Rückstellkraft) verbessert die Gesamtkraft
- aber nicht wegen mehr Querbrücken, sondern wegen elastischer Vorspannung.
- Dadurch können mehr Querbrücken gebildet werden → größere Kraftentwicklung
- Beispiel: Vor dem Sprung leicht in die Hocke gehen (Quadrizeps wird vorgedehnt)
- Bei starker Dehnung sinkt die Überlappung → es gibt zu wenige Querbrücken → Kraft sinkt → Beispiel: Beim Spagat können die Muskeln keine große Kraft entwickeln.
Verkürzung:
- Bei einer maximalen Verkürzung des Muskels (z. B. bei maximaler Kontraktion) sinkt die Kraftproduktion, da die Filamente (Aktin und Myosin) weniger effizient überlappen → die Filamente überlappen sich zu stark, Querbrücken stören sich gegenseitig
- Bizeps-Curl (maximale Beugung): Wenn der Bizeps vollständig kontrahiert (z. B. bei der oberen Position eines Curls), kann er weniger Kraft erzeugen oder Wadenheben in der Hocke
Zusammengefasst:
- Vordehnung → mehr Kraft
- Verkürzung → weniger Kraft
- Querbrücken = Verbindungen zwischen den Myosinfilamenten und den Aktinfilamenten in einem Sarkomer`},{id:`Grundlagen des Krafttrainings 🏋-14`,topic:`Grundlagen des Krafttrainings 🏋`,section:`Allgemein`,question:`14) Was versteht man unter dem Begriff „Rekrutierungsschwerpunkt“?`,answer:`Der Rekrutierungsschwerpunkt bezeichnet die aktivierten Muskelfasern bei einer bestimmten Belastungsintensität. Je nach Kraftaufwand und Belastung wird mehr oder weniger von den schnellen oder langsamen Muskelfasern rekrutiert.
- Bei niedrigen Belastungen (z. B. leichte bis moderate Gewichte, lockeres Joggen) werden vor allem die langsamen Muskelfasern Slow Twitch (Typ I) aktiviert.
- Bei steigender Intensität und zunehmender Ermüdung(z. B. schwere Gewichte, Sprint) werden zunehmend auch die schnellen Muskelfasern Fast Twitch (Typ II) rekrutiert, da sie für die hohe Kraftproduktion notwendig sind
- Intervalltraining → beide Fasertypen werden abwechselnd betont
- Muskelaufbau und Leistungssteigerung: Um Kraft und Muskelmasse gezielt aufzubauen, müssen vor allem die Typ II-Fasern maximal beansprucht werden. Das erfordert Training mit hohen Belastungen und intensiven Bewegungen.`},{id:`Anatomie 🩻-1`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`1) Aus welchen Knochen besteht der Schultergürtel?`,answer:`- Der Schultergürtel besteht aus 4 Knochen → 2 links und 2 rechts
- Dem Schulterblatt (Scapula) und dem Schlüsselbein (Clavicula)
- Verbindungen:
  - Clavicula ↔ Sternum → Sternoclaviculargelenk (einzige echte knöcherne Verbindung zum Rumpf)
  - Clavicula ↔ Scapula → Acromioclaviculargelenk
  - Scapula ↔ Thorax → funktionelles Schulterblatt-Thorax-Gleitlager
- Funktion:
  - Stabilisiert die obere Extremität am Rumpf
  - Das Schlüsselbein verbindet das Brustbein (Sternum) mit dem Schulterblatt und stabilisiert den Schultergürtel
  - Sorgt für hohe Beweglichkeit des Arms
  - Die Scapula liegt auf dem Rücken und bildet mit dem Oberarmknochen (Humerus) das Schultergelenk
[Abbildung im Wiki]`},{id:`Anatomie 🩻-2`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`2) Aus welchen Knochen setzt sich das SC- Gelenk und das AC- Gelenk zusammen?`,answer:`- Sternoclaviculargelenk (SC- Gelenk): Das SC-Gelenk verbindet Schlüsselbein (Clavicula) mit dem Brustbein (Sternum) → Brustbein-Schlüsselbeingelenk
  - Einzige Gelenk, das den Schultergürtel mit dem Rumpf verbindet
  - Sattelgelenk für Rotation und Hebung + Senkung des Arms
  - Relativ stabil
- Acromioclaviculargelenk (AC- Gelenk): Das AC-Gelenk verbindet das Schlüsselbein (Clavicula) mit dem Acromiom der Scapula
  - Heben und Senken des Schultergürtels
  - Anfällig für Verletzungen
[Abbildung im Wiki]`},{id:`Anatomie 🩻-3`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`3) Aus welchen Muskeln besteht die Rotatorenmanschette?`,answer:`Besteht aus 4 Muskeln → stabilisieren das Schultergelenk und ermöglichen die Beweglichkeit des Arms
1. m. supraspinatus (Obergrätenmuskel) → Abduktion (Heben) des Arms
  - Ursprung: Fossa supraspinata (oberer Teil der Scapula)
  - Ansatz: Tuberculum majus
1. m. infraspinatus → Außenrotation des Arms
  1. Ursprung: Fossa infraspinata (unterer Teil der Scapula)
  1. Ansatz: Tuberculum majus
1. m. teres minor → Außenrotation + Adduktion des Arms + Retroversion
  - Ursprung: Margo lateralis (Außenseite der Scapula)
  - Ansatz: Tuberculum majus
1. m. subscapularis (Unterschulterblattmuskel) → Innenrotation des Arms
  - Ursprung: Fossa subscapularis (Vorderseite der Scupula)
  - Ansatz: Tuberculum minus
[Abbildung im Wiki]`},{id:`Anatomie 🩻-4`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`4) Welche 4 Bewegungen können mit der Wirbelsäule durchgeführt werden?`,answer:`1. Flexion → Beugung nach vorne
1. Extension → Streckung nach hinten
1. Lateralflexion → Seitneigung / Beugung zur Seiten
1. Rotation → Drehung um ihre eigene Achse
- Halswirbelsäule: Flexion, Extension, Lateralflexion und Rotation gut
- Brustwirbelsäule: Rotation und Flexion gut, aber Extension und Lateralflexion begrenzt
- Lendenwirbelsäule: Flexion und Extension gut, aber Rotation eingeschränkt`},{id:`Anatomie 🩻-5`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`5) Wo liegt das Illiosakralgelenk und aus welchen Knochen besteht es?`,answer:`Das ISG liegt rechts und links hinten im Becken, zwischen Kreuzbein (Os sacrum) und Darmbein (Os ilium) → Kreuzbein-Darmbein-Gelenk
- Verbindet Wirbelsäule mit dem Becken
- Eines der stabilsten Gelenke des Körpers, fast unbeweglich (Beweglichkeit: nur wenige Millimeter/Grade)
- Gesichert durch sehr starke Bänder (z. B. Lig. sacroiliaca anteriora, posteriora, interossea)
- Funktion: Kraftübertragung zwischen Wirbelsäule und Beinen, Stoßdämpfung bei Gehen und Laufen
- Häufiger Auslöser für viele Beschwerden im unteren Rücken und Beckenbereich
[Abbildung im Wiki]`},{id:`Anatomie 🩻-6`,topic:`Anatomie 🩻`,section:`Allgemein`,question:`6) Wählen Sie 3 Atemtechniken aus und beschreiben Sie diese.`,answer:`1. Klassische Methode: überwindender Arbeit (konzentrisch) → ausatmen und nachgebender Arbeit (exzentrisch) → einatmen
1. Nach A. Murray → umgekehrt
1. Nach Kieser: Atemrythmus und Bewegungsryhtmus müssen nicht übereinstimmen
1. Nach Kölbl: Bewegungsmitte einatmen und beim Umkehrpunkt ausatmen → mehr Sauerstoff als sonst
1. Nach Zatsiorsky: anatomisch → bei leichten Lasten oder öffnen des Brustkorbs einatmen und biomechanisch → bei großer Last ausatmen
1. Pressatmung (Valsalva-Manöver): Einatmen → Luft anhalten → Gewicht bewegen → wuchtig ausatmen
  - Das Zwerchfell wird in Einatemstellung fixiert, um ein Widerlager zu schaffen → Druckaufbau im Bauch- und Beckenraum
  - Inneres Korsett
  - Durch das Absenken des Zwergfells steigt der Druck im Bauchraum und den Beckenboden (Rumpf)
  - Somit kann man höhere Gewichte stemmen (z.B.: Strongmen)
