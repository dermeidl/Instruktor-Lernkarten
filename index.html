- Bauch stärken
- Bird Dog
- → Darius: Hyperextension und Reverse Crunch
Dehnen: Hüftbeuger, Oberschenkel Vorderseite, Rückenstrecker
Begründung
Beim Hohlkreuz zieht die Kombination aus verkürzten Hüftbeugern/Rückenstreckern und schwachen Bauch- & Gesäßmuskeln das Becken in eine verstärkte Lordose.
Durch Kräftigung von Bauch und Gluteus sowie gleichzeitige Dehnung von Iliopsoas und Rückenstrecker wird das muskuläre Gleichgewicht wiederhergestellt und die Wirbelsäule in eine physiologische Haltung gebracht.`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-7`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Plan von Darius → 3x15-20Wdh`,question:`5) Ein klassisches Zirkeltraining mit Fitnessgeräten: Organisation Übungen, Dauer, Pausenzeiten, Signalgebung etc.`,answer:`- Es gibt Stationstraining → z.B. klassisches Krafttraining und Zirkel bzw. Kreistraining
- Man gibt an welche Art (Station, Kreistraining), Übungen, Richtung,
  - Übungsblatt: Bilder, Name, Beschreibung, Material, Alternativen / Variationen
- Halbzeit beachten
- Belastungs- / Pause Verhältnis beachten → bei Fortgeschrittenen 15 Sekunden Pause
- App für Timer
Ein klassisches Zirkeltraining umfasst 6–12 Geräte in wechselnder Reihenfolge (Oberkörper–Unterkörper). An jeder Station wird ca. 30–60 Sek. oder 12–20 Wdh. gearbeitet, mit 15–30 Sek. Wechselpause. Nach 1 Runde (6–12 Stationen) folgt 2–3 Min. Pause, insgesamt 2–3 Runden. Signalgebung erfolgt akustisch (z. B. Pfeife, Musikintervall) zum Stationswechsel. Ziel: ökonomische Organisation, Kraftausdauer, allgemeine Fitness. → Klatschen als Signal`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-8`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Plan von Darius → 3x15-20Wdh`,question:`6) Ein Super – Cirkuit – Programm im Gymnastiksaal: Organisation Übungen, Dauer, Pausenzeiten, Signalgebung etc.`,answer:`- Super-Cirkuit = Kraftstation mit Ausdauerstation abwechseln
Ein Super-Cirkuit im Gymnastiksaal besteht aus 8–12 Stationen mit Kleingeräten und Eigengewichtsübungen. Belastung pro Station 30–60 Sek., Pausen 15–20 Sek., nach 1 Runde 2–3 Min. Insgesamt 2–3 Durchgänge. Signalgebung erfolgt akustisch (Pfeife, Musik) oder durch Trainer. Besonderheit: Kombination von Kraft- und Ausdauerübungen zur ganzheitlichen Förderung von Kraftausdauer, Koordination und Kondition.
Stationen: Seilspringen (Ausdauer), Liegestütz (Brust, Armkraft), Step-Ups auf Stepbrett (Beine + Puls), Sit-ups oder Crunches (Bauch), Medizinball-Werfen zu Partner (Rumpfkraft), Kniebeugen mit Hantel/Bodyweight (Beine), Burpees (Ganzkörper, Puls), Therabandrudern (Rücken)`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-9`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Plan von Darius → 3x15-20Wdh`,question:`7) Ein Super – Cirkuit – Programm im Fitnessraum: Organisation Übungen, Dauer, Pausenzeiten, Signalgebung etc.`,answer:`Ein Super-Cirkuit im Fitnessraum kombiniert 8–12 Stationen an Kraft- und Ausdauergeräten. Kraftübungen ca. 12–15 Wdh. (30–45 Sek.), Ausdauergeräte 1–2 Min. mittlere Intensität. Pausen: 15–20 Sek. zwischen Stationen, 2–3 Min. zwischen Runden. Insgesamt 2–3 Runden. Signalgebung erfolgt akustisch (Pfeife, Musik) oder visuell (Timer). Ziel: Kombination von Kraftausdauer- und Ausdauertraining, Förderung von Herz-Kreislauf und Muskelkraft.
Stationen: Beinpresse (Kraft), Laufband (Ausdauer), Brustpresse (Kraft), Rad-Ergometer (Ausdauer), Latzug oder Rudern am Kabel (Kraft), Crosstrainer (Ausdauer), Schulterdrücken (Kraft), Ruderergometer (Ausdauer), Bauchmaschine (Kraft)`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-10`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Plan von Darius → 3x15-20Wdh`,question:`8) Feststellung des Kraftdefizites und Programm zur Erhöhung der intramuskulären Koordination.`,answer:`Das Kraftdefizit ist die Differenz zwischen maximal willkürlich entwickelter und absoluter Kraft. Es zeigt eine unvollständige Muskelfaseraktivierung an. Zur Verbesserung der intramuskulären Koordination wird Maximalkrafttraining mit hohen Intensitäten (85–100 % 1RM, 1–3 Wdh., 4–6 Sätze, lange Pausen) durchgeführt. Ergänzend eignen sich Explosivkraft- und isometrische Methoden. Ziel ist die bessere Rekrutierung, Frequenzierung und Synchronisation der Muskelfasern. → Maximalkrafttraining
z.B. 100kg Bankdrücken → dann 90% also 90kg → wenn mehr als 3wdh, dann Kraftdefizit → Maximalkrafttraining
Zur Verbesserung der intramuskulären Koordination im Bankdrücken wird ein 4-wöchiger Maximalkraftplan mit 2 Einheiten pro Woche durchgeführt. Trainiert wird im Bereich von 85–95 % des 1RM, mit 1–5 Wiederholungen pro Satz, 3–6 Sätzen und langen Pausen von 3–5 Minuten. Die konzentrische Phase wird so explosiv wie möglich ausgeführt, die exzentrische kontrolliert.
Ergänzend werden Rücken- und Schulterstabilisatoren mit moderater Intensität trainiert. Dadurch wird die Rekrutierung und Synchronisation der motorischen Einheiten verbessert, das Kraftdefizit verringert und die willkürliche Maximalkraft gesteigert.`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-11`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Tests`,question:`10) Nennen Sie 5 Cardio- Testverfahren und erklären Sie detailliert eines davon!`,answer:`[Anhang im Wiki]
[Anhang im Wiki]
[Anhang im Wiki]
[Anhang im Wiki]
[Anhang im Wiki]
1. Cooper Test (12-Minuten-Lauf → Distanz messen)
1. WHO 3 Stufen → Fahrrad Ergometer Test
  - submaximaler Test
  - 3 Belastungsstufen a 4 Minuten = 12 Minuten
  - werden von Tabelle abgelesen
  - 2-3 Minuten locker ausradeln
  - Ergebnis = Einschätzung / gerechnete VO2max
  - Test für untrainierte, keine Sportler
  - Trainingsvorgaben können nicht abgeleitet werden
  - Argumentation bei Verkauf
1. Laktat Stufen Test
  - allgemein (alle auf Fahrrad), semispezifisch (Radfahrerer auf Radergometer), spezifisch (Radfahrer auf eigenem Fahrrad)
  - Ausbelastungstest
  - Stufenförmige Steigerung der Belastung
  - Erfassen der inneren Beanspruchung durch den Paramter Laktatkonzentration
  - Volle Kohlenhydratspeicher → Speicher füllen sich, wenn man alles richtig macht erst nach 48 Stunden → man ist fast immer teilentleert
  - Zuerst in Muskeln eingelagert, dann in Leber  → Low Carb Ermährung = Leber ist fast immer leer
1. Conconi Test (Stufenbelastung → anaerobe Schwelle durch Pulsfrequenzkurve)
  - Ausbelastungstest auf Laufband oder Laufbahn
  - Anfangsgeschwindigkeit ca 6-8kmh
  - Steigerung je 200m um 0,5kmh
  - Abflachung / Knick = anaerobe Schwelle
  - Trainingsbereiche können davon abgeleitet werden
1. Chester-Step-Test (Stufensteigen mit ansteigender Belastung → Herzfrequenzkontrolle)
1. Astrand-Rhyming-Test (Fahrradergometer, 6 Minuten → VO₂max-Schätzung)
1. PWC 130/150/170 (Physical Working Capacity → Belastung bei festgelegtem Puls)
  - Fahrradergometer
  - Submaximaler Test → sicherer, auch für ältere/ungeübte Personen geeignet.
  - Belastungsstufen (á 2 Minuten) bis Puls 170 (150 ab 35
Jahren, 130 ab 50 Jahren)
  - Belastungsvorgabe: 50W für untrainierte Frauen, Senioren, 100W untrainierte Männer, mäßig trainierte Frauen, 150W alle anderen
  - Aufwärmen: 2 min locker treten
  - Stufenhöhe 25W
  - Ergebnis ist die Wattleistung pro kg Körpergewicht bei Puls 170 (150/130)
  - Nutzen ist die Einschätzung der aeroben Leistungsfähigkeit
  - Keine konkreten Trainingsvorgaben ableitbar
  - Argumentationshilfe beim Verkauf`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-12`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Tests`,question:`Warum Verkürzungstests?`,answer:`- Früherkennung von muskulären Dysbalancen (z. B. durch Bewegungsmangel, Fehlhaltungen, einseitige Belastung).
- Vorbeugung von Beschwerden wie Haltungsschäden, Gelenkproblemen oder Rückenschmerzen.
- Grundlage für Trainingsplanung → Entscheidung, welche Muskeln gedehnt und welche gekräftigt werden müssen.
- Erhöhung der Bewegungsqualität und Verletzungsprophylaxe.
- Objektive Kontrolle von Beweglichkeit und Fortschritt.`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-13`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Tests`,question:`12) Zeigen Sie Verkürzungstests – die jeweiligen Kräftigungsübungen / Dehnübungen. Benennen Sie Ursprung, Ansatz, Funktion.`,answer:`1. Brust → Beine anwinkeln, Rücken gerade, Schultern nicht abheben → Brust fallen lassen
1. Oberschenkelvorderseite → am Bauch legen
1. Hüftbeuger → am Rücken dann ein Knie zum Bauch
1. Nacken
1. Hamstrings → am Rücken und gestreckt zum Oberkörper führen
1. Lat
1. Waden
1. IR + AR`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-14`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Tests`,question:`Wozu?`,answer:`- Gesundheit: Erkennen von Übergewicht, Adipositas, Mangelernährung
  - Leistungsdiagnostik: Einschätzung der Körperzusammensetzung (Fett vs. Muskel)
  - Trainingssteuerung: Kontrolle von Fortschritten (Muskelaufbau, Fettreduktion)
  - Motivation: Sichtbarer Nachweis für Klienten
  - Risikoeinschätzung: Zusammenhang mit Herz-Kreislauf-Erkrankungen, Stoffwechselstörungen
Messtechniken
  - Hautfaltenmessung (Caliper-Methode)
  - Bioelektrische Impedanzanalyse (BIA)
  - DEXA (Dual-Röntgen-Absorptiometrie)
  - Hydrostatisches Wiegen (Unterwasserwiegen)
  - Air-Displacement-Plethysmographie (Bod Pod)
  - Ultraschall
  - Computertomographie
  - Infrarot
  - BMI
Demonstration Fat-Caliper-Methode am Partner
Haut- und Unterhautfettfalte wird mit einer Messzange (Caliper) erfasst → Dicke der Falte korreliert mit dem Körperfettanteil.
1. Messpunkte festlegen (z. B. Trizeps, Bizeps, Subscapular, Suprailiacal; je nach Protokoll 3, 4 oder 7 Punkte).
  - 3-Punkt-Methode nach Jackson & Pollock (Männer: Brust, Bauch, Oberschenkel; Frauen: Trizeps, Suprailiacal, Oberschenkel).
1. Partner steht entspannt, Haut trocken, keine Creme.
1. Mit Daumen und Zeigefinger eine Hautfalte ca. 1 cm oberhalb der Messstelle fassen.
1. Caliper senkrecht ansetzen, 1 cm neben der Fingerhaltung.
1. Nach 2 Sekunden den Wert ablesen (in mm).
1. Alle Messungen zweimal durchführen und Mittelwert bilden.
1. Werte in Formeln oder Tabellen einsetzen → Schätzung des Körperfettanteils (%).`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-15`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Tests`,question:`14) Nennen Sie die 3 Körperkonstitutionstypen nach Sheldon und nach Kretschmar!`,answer:`Sheldon
  - Leptosom (schmal, hager, lange Gliedmaßen, wenig Fett- und Muskelmasse, eher „schizophrene“ Veranlagung (nach Kretschmer))
  - Athletisch (breitschultrig, muskulös, kräftiger Knochenbau, eher „epileptische“ Veranlagung (nach Kretschmer))
  - Pyknisch (gedrungen, rundlich, breite Brust, Neigung zu Bauchfett, häufig mit „manisch-depressiver“ Veranlagung in Verbindung gebracht)
Kretschmar
  - Ektomorph (schlank, zierlich, lange Gliedmaßen, wenig Fett- und Muskelmasse, Charakter: zurückhaltend, introvertiert)
  - Endomorph (rundlich, weiches Gewebe, neigt zu Fettansatz, kurze Extremitäten, kräftiger Bauch, Charakter (nach Sheldon): gemütlich, gesellig)
  - Mesomorph (muskulös, athletisch, breite Schultern, kräftiger Knochenbau, wenig Körperfett, Charakter: durchsetzungsfähig, aktiv)
[Abbildung im Wiki]`},{id:`Lehrauftritt im Fitnessstudio 👩‍🏫-16`,topic:`Lehrauftritt im Fitnessstudio 👩‍🏫`,section:`Tests`,question:`15) Nennen Sie die Ausschluss- und Abbruchkriterien bei Cardio Tests oder beim Cardiotraining!`,answer:`Ausschlusskriterien (Test wird gar nicht erst gestartet):
  - Akute Erkrankungen (z. B. Infekte, Fieber, akute Verletzungen)
  - Medikamente
  - Krebs
  - Herz-Kreislauf-Erkrankungen (Herzinfarkt, instabile Angina pectoris, frischer Schlaganfall)
  - Bluthochdruck
  - Schwere Atemwegserkrankungen (akuter Asthmaanfall, COPD-Exazerbation)
  - Akute Thrombose, Embolie oder schwere Stoffwechselentgleisung (z. B. Ketoazidose)
  - Auffällige Koordinationsprobleme
  - Postoperative Zustände ohne ärztliche Freigabe
Abbruchkriterien (Test/Training wird sofort beendet):
  - Auf Wunsch der Testperson: der Kunde sagt „geht nicht mehr / ich breche ab“
  - Pulsabfall trotz Belastungssteigerung
  - Beschwerden - Schwindel, Übelkeit
  - Auffallende Äußere Anzeichen
  - Brustschmerzen, Engegefühl, Druck im Brustkorb
  - Schwindel, Gleichgewichtsstörungen, Ohnmachtsgefühl
  - Massive Atemnot oder pfeifende Atmung (Bronchospasmus)
  - Blässe, Kaltschweißigkeit, auffällige Hautfarbe
  - Plötzliche motorische Einschränkungen (z. B. Lähmung, starke Koordinationsprobleme)
  - Herzrhythmusstörungen (z. B. sichtbare Arrhythmien, auffälliger Puls)
  - Blutdruckabfall oder extreme Blutdrucksteigerung
  - Unerträgliche Schmerzen (Muskeln, Gelenke, Rücken)`}],si=`bspa-lernkarten-history-v1`,ci=[10,20,30,50];function li(e){let t=[...e];for(let e=t.length-1;e>0;--e){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t}function ui(e){return e.replace(/\s*[🤓🧑‍🏫⚙️🏋🩻]+\s*/gu,``).replace(/\s*\(ausgearbeitet.+$/i,``).trim()}function di({answer:e}){return(0,R.jsx)(`div`,{className:`answer-copy`,children:e.split(`
